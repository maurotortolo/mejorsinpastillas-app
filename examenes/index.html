<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#25348F">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../icons/icon-192.png">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Mini exámenes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Carlito:wght@400;700&display=swap" rel="stylesheet">
<style>
/* Layout: lista de exámenes por parte del libro; al entrar, una pregunta por pantalla con respuesta inmediata. */
:root{--navy:#25348F;--green:#2F6B5B;--mint:#D6EFE6;--sand:#EFE9DC;--bg:#F5F6FA;--card:#FFFFFF;--ink:#1C2033;--muted:#5D6478;--line:#DDE1EC;--on:#FFFFFF;
  --good:#2F6B5B;--goodbg:#D6EFE6;--bad:#A3412F;--badbg:#F7E1DC;
  --font:"Carlito",Calibri,"Segoe UI",system-ui,sans-serif;color-scheme:light}
@media (prefers-color-scheme: dark){:root{--navy:#8E9CF0;--green:#7CC9AE;--mint:#1F3A33;--sand:#2B2820;--bg:#11131C;--card:#1A1D2A;--ink:#E9EBF3;--muted:#A3A9BD;--line:#2C3042;--on:#11131C;--good:#7CC9AE;--goodbg:#1F3A33;--bad:#F0A493;--badbg:#3A2420;color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.4;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--green);outline-offset:2px}
.app{display:flex;flex-direction:column;height:100%;max-width:640px;margin:0 auto}
header{background:#25348F;color:#fff;padding:calc(14px + env(safe-area-inset-top)) 18px 14px}
header a,header button.back{font-size:12px;letter-spacing:.14em;text-transform:uppercase;opacity:.85;color:#fff;text-decoration:none;background:none;border:0;padding:0}
header h1{margin:2px 0 0;font-size:24px;text-wrap:balance}
header p{margin:4px 0 0;font-size:14px;opacity:.85}
main{flex:1;overflow-y:auto;padding:16px 16px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px}
main>*{flex-shrink:0}
.intro{background:var(--sand);border-radius:12px;padding:12px 14px;font-size:15px}
h2{font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--green);margin:10px 0 0}
.ex{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;text-align:left;width:100%}
.ex .n{flex:none;width:40px;height:40px;border-radius:50%;background:var(--mint);color:var(--green);display:grid;place-items:center;font-weight:700}
.ex .txt{flex:1;min-width:0}
.ex b{display:block;font-size:17px}
.ex small{color:var(--muted);font-size:13px;display:block}
.score{flex:none;font-weight:700;color:var(--green);font-variant-numeric:tabular-nums;font-size:15px;text-align:right}
.score span{display:block;font-weight:400;color:var(--muted);font-size:12px}
.prog{height:6px;border-radius:4px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:var(--green)}
.qnum{color:var(--muted);font-size:14px}
.q{font-size:20px;font-weight:700;margin:0;text-wrap:balance}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px 14px;width:100%}
.opt .l{flex:none;font-weight:700;color:var(--navy);width:20px}
.opt.tf{justify-content:center;font-weight:700;font-size:19px;padding:16px}
.opts.tfrow{flex-direction:row}
.opts.tfrow .opt{flex:1}
.opt[disabled]{cursor:default}
.opt.correct{border-color:var(--good);background:var(--goodbg)}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.fb{border-radius:12px;padding:12px 14px;font-size:16px}
.fb.ok{background:var(--goodbg)}
.fb.no{background:var(--badbg)}
.fb b{display:block;margin-bottom:2px}
.btn{border:0;border-radius:12px;padding:14px 16px;font-weight:700;background:var(--navy);color:var(--on);width:100%}
.btn.ghost{background:none;color:var(--navy);border:1px solid var(--line)}
.big{font-size:44px;font-weight:700;color:var(--green);margin:0;font-variant-numeric:tabular-nums}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.card h3{margin:0 0 6px;font-size:18px}
.miss{border-top:1px solid var(--line);padding-top:8px;margin-top:8px;font-size:15px}
.muted{color:var(--muted);font-size:14px}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:14px;padding:4px 0;align-self:center}
footer{text-align:center;color:var(--muted);font-size:12px;padding:4px 0 8px}
</style>
</head>
<body>
<div class="app">
<header id="hdr"></header>
<main id="main"></main>
</div>
<script>
(function(){
"use strict";
var EX=[{"n": 1, "title": "Viejas lentes", "part": "Primera parte. Cómo perder salud", "q": [{"t": "Las viejas lentes de la medicina comparan el cuerpo humano con…", "o": ["Un árbol en constante adaptación a su entorno.", "Una máquina que hay que reparar y un campo de batalla contra enemigos externos.", "Un sistema complejo cuyas propiedades emergen de muchas interacciones.", "Un río que cambia de curso según el ambiente."], "a": 1, "e": "Sirven para muchas cosas, pero se quedan cortas frente a los problemas de salud más comunes."}, {"t": "Las viejas lentes ya no sirven y deberían abandonarse.", "o": [], "tf": true, "a": 1, "e": "Siguen siendo útiles y resuelven problemas inmediatos. El problema es que dejan afuera lo más importante: el terreno donde se origina la enfermedad."}, {"t": "Con las viejas lentes, la diabetes tipo 2 se entiende sobre todo como…", "o": ["Un exceso de grasa en el hígado y el páncreas.", "Una falta de masa muscular.", "Una infección que hay que combatir.", "Un exceso de azúcar en sangre que hay que bajar."], "a": 3, "e": "En la gran mayoría de los casos, la diabetes tipo 2 es consecuencia del exceso de grasa, sobre todo dentro del hígado y del páncreas. Bajar el número no toca la raíz."}, {"t": "Sobre la insulina en la diabetes tipo 2, ¿cuál es la opción correcta?", "o": ["Es mala y conviene dejarla cuanto antes.", "Ataca la raíz del problema.", "Baja la glucemia, pero uno de sus efectos es favorecer el aumento de grasa. Para muchas personas es imprescindible, y nunca se suspende ni se modifica sin indicación médica.", "No tiene ningún efecto sobre la grasa corporal."], "a": 2, "e": "Sola no alcanza, porque baja el número sin tocar la raíz. Pero eso no la vuelve mala: si usás insulina, no la suspendas por tu cuenta."}, {"t": "¿Qué factor explica hasta dos tercios del riesgo de hipertensión?", "o": ["La genética.", "El café.", "El sobrepeso.", "El frío."], "a": 2, "e": "La buena noticia es la otra cara: por cada kilo de grasa que se pierde, la presión baja, en promedio, alrededor de 1 mmHg."}, {"t": "¿Qué hallazgo muestra que, en el cáncer, una mutación genética no alcanza por sí sola?", "o": ["Muchas mutaciones típicas del cáncer aparecen también en tejidos sanos de personas que nunca desarrollan la enfermedad.", "Ningún cáncer tiene mutaciones.", "Todos los cánceres son hereditarios.", "Los tumores tienen siempre la misma mutación."], "a": 0, "e": "La mutación es como una semilla: para crecer necesita un suelo favorable (inflamación, exceso de grasa, defensas debilitadas), que depende en buena parte de cómo vivimos."}, {"t": "Aproximadamente, ¿qué proporción de las muertes por cáncer se relaciona con factores de riesgo en buena parte modificables (tabaco, alcohol, exceso de grasa, alimentación, sedentarismo)?", "o": ["1 de cada 100.", "1 de cada 10.", "Cerca de 4 de cada 10.", "Todas."], "a": 2, "e": "Es mucho más que mala suerte."}], "caps": "Viejas lentes", "repaso": "Viejas lentes"}, {"n": 2, "title": "Una nueva mirada, la tierra y las raíces", "part": "Primera parte. Cómo perder salud", "q": [{"t": "Somos un sistema complejo. ¿Qué significa complejo?", "o": ["Que tenemos muchas piezas que encastran entre sí.", "Que todas las personas responden igual al mismo estímulo.", "Que es mejor dejar la salud solo en manos de especialistas.", "Que, por la enorme cantidad de conexiones, la respuesta del cuerpo no es lineal ni del todo predecible: el todo es más que la suma de las partes."], "a": 3, "e": "Por eso el mismo estímulo puede afectar mucho a una persona y nada a otra."}, {"t": "En la metáfora del árbol, ¿cuál es la opción correcta?", "o": ["La tierra son los requisitos básicos y las raíces, los hábitos.", "La tierra son tus hábitos y el ambiente que los condiciona; las raíces, los requisitos básicos que esa tierra debe satisfacer.", "El tronco son los frutos visibles.", "Las ramas representan los hábitos de vida."], "a": 1, "e": "Si la tierra es lo que hacés, las raíces son lo que tu organismo recibe de eso."}, {"t": "¿Cuál NO es uno de los engranajes de la pobre tierra actual?", "o": ["Comida inapropiada.", "Sedentarismo mental.", "Desconexión natural.", "Falta de suplementos vitamínicos."], "a": 3, "e": "Los cinco engranajes son comida inapropiada, sedentarismo físico, sedentarismo mental, desconexión natural y desconexión social."}, {"t": "Alguien que vive a las corridas y no para de pensar no puede tener sedentarismo mental.", "o": [], "tf": true, "a": 1, "e": "Una mente ocupada no es una mente entrenada. Vivir en piloto automático, con una carga mental agobiante y la atención atrapada por las pantallas, es sedentarismo mental."}, {"t": "Sobre el exceso de grasa, ¿cuál es la opción correcta?", "o": ["Todas las personas toleran la misma cantidad de grasa.", "La grasa debajo de la piel es la más dañina.", "Solo importa el número de la balanza.", "Cada persona tolera una cantidad distinta: algunas, con unos pocos kilos de más, ya desarrollan diabetes."], "a": 3, "e": "Además, importa dónde está: la grasa dentro del abdomen y en los órganos es la más dañina."}, {"t": "Huesos y músculos siguen la regla “lo que no se usa, se pierde”. ¿Qué los fortalece?", "o": ["Que se los exija: cuanto más se los usa con esfuerzo, más se fortalecen.", "Los suplementos.", "El reposo absoluto.", "Tomar más agua."], "a": 0, "e": "Si no se los usa, el cuerpo los desmantela para ahorrar recursos. Con poca masa magra aparecen debilidad, fragilidad, lesiones y dolor."}, {"t": "¿Con qué se sincroniza principalmente tu reloj biológico central?", "o": ["Con el horario de las comidas.", "Con la temperatura de la casa.", "Con el despertador.", "Con la luz del sol y la oscuridad de la noche."], "a": 3, "e": "Si pasamos el día bajo techo y la noche frente a pantallas, igualamos el día y la noche y el reloj pierde su referencia."}, {"t": "Después de dormir poco, lo más probable es que…", "o": ["Comas menos al día siguiente.", "Comas más (en los estudios, unas 250 a 400 kcal más por día) y te cueste resistir las tentaciones.", "No cambie nada.", "Regules mejor tus emociones."], "a": 1, "e": "Las raíces están entrelazadas: el mal sueño empuja hacia el exceso de grasa."}], "caps": "Una nueva mirada, La pobre tierra actual y Las raíces", "repaso": "Una nueva mirada, La pobre tierra actual y Las raíces"}, {"n": 3, "title": "El tronco, la copa, la trama vital y el árbol enfermo", "part": "Primera parte. Cómo perder salud", "q": [{"t": "¿Cuál de estas NO forma parte del tronco del árbol?", "o": ["La inflamación crónica.", "La resistencia a la insulina.", "Las fallas mitocondriales.", "El sedentarismo."], "a": 3, "e": "El sedentarismo es parte de la tierra. El tronco reúne las fallas comunes que generan las raíces enfermas: combustibles tóxicos, inflamación crónica, trastornos hormonales, fallas mitocondriales, defensas alteradas y acumulaciones nocivas."}, {"t": "La inflamación crónica…", "o": ["Es silenciosa y persistente, y la enciende sobre todo el exceso de grasa.", "Da fiebre y dolor intenso.", "Aparece solo en las infecciones.", "Se resuelve con antiinflamatorios."], "a": 0, "e": "Es una de las fallas del tronco. Por eso, perder el exceso de grasa la apaga desde la raíz."}, {"t": "En la trama vital, las influencias van en una sola dirección: de la tierra a las raíces, de ahí al tronco y por último a los frutos.", "o": [], "tf": true, "a": 1, "e": "Muchas veces los frutos empobrecen la misma tierra que les dio origen. Por ejemplo, el dolor de la artrosis limita el movimiento y suma más sedentarismo."}, {"t": "¿Qué explica la clave “un tronco, muchos frutos”?", "o": ["Por qué es tan común que una misma persona tenga a la vez hígado graso, presión alta y dolor de rodillas.", "Por qué cada enfermedad tiene una sola causa.", "Por qué cada problema necesita su propio especialista.", "Por qué los frutos maduran rápido."], "a": 0, "e": "Con las viejas lentes son tres problemas y tres especialistas; con las nuevas, frutos del mismo árbol. Si cuidás la tierra, mejorás todo el árbol."}, {"t": "“Los frutos maduran tarde.” ¿Qué implica?", "o": ["Que esperar a que aparezca el fruto es llegar tarde, pero también que hay mucho tiempo para actuar sobre la tierra.", "Que no se puede hacer nada para prevenirlos.", "Que los frutos aparecen enseguida.", "Que primero sube la glucemia y después se altera el metabolismo."], "a": 0, "e": "El árbol puede llevar años enfermando en silencio antes de que suba la glucemia o la presión."}, {"t": "Entender el fruto como expresión del árbol significa que ya no hace falta tratarlo con fármacos o procedimientos.", "o": [], "tf": true, "a": 1, "e": "Una presión muy alta, una glucemia descontrolada o una arteria obstruida necesitan atención médica. La nueva mirada no reemplaza ese cuidado: lo amplía."}, {"t": "¿Qué implica la clave “un fruto, muchas raíces”?", "o": ["Que cada enfermedad tiene una única causa.", "Que casi ningún fruto tiene una sola causa, y por eso el abordaje más efectivo rara vez es una sola medida.", "Que con un buen fármaco alcanza.", "Que las raíces no influyen en los frutos."], "a": 1, "e": "Es la otra cara de “un tronco, muchos frutos”."}, {"t": "Las fallas del tronco funcionan por separado: hay que reparar cada una con su propio tratamiento.", "o": [], "tf": true, "a": 1, "e": "Se alimentan entre sí. Cuando mejorás la tierra, fortalecés todo el tronco a la vez. Incluso cambia la forma en que se expresan tus genes: tus genes no son tu destino."}], "caps": "El tronco, La copa, La trama vital y El árbol enfermo", "repaso": "El tronco, La copa, La trama vital y El árbol enfermo"}, {"n": 4, "title": "El sistema de buenos hábitos y el marco nutricional", "part": "Segunda parte. Cómo ganar salud", "q": [{"t": "Los buenos hábitos funcionan como una lista: cada uno suma su beneficio, sin relación con los demás.", "o": [], "tf": true, "a": 1, "e": "Forman un sistema: cada engranaje mueve a los demás, y todos mueven al árbol."}, {"t": "¿Con qué pregunta empieza el algoritmo de la nutrición apropiada?", "o": ["¿Cuántas calorías necesito?", "¿Cuántas comidas tengo que hacer?", "¿Soy vegetariano?", "¿Es necesario perder grasa?"], "a": 3, "e": "Y la respuesta no es para siempre: por eso el esquema tiene flechas de reevaluación."}, {"t": "¿Cuál NO es una premisa del marco nutricional general?", "o": ["Priorizar comida natural o mínimamente procesada.", "Comer de día.", "Cubrir los nutrientes (sobre todo la proteína) y tomar agua según la sed.", "Contar las calorías de cada comida."], "a": 3, "e": "Si cuidás el qué y el cuándo, en la mayoría de los casos no hace falta contar calorías. La única cuenta propuesta es la de las proteínas."}, {"t": "Sobre la cena, ¿qué propone el libro?", "o": ["Da igual a qué hora cenes.", "Que sea la comida más liviana del día, que termine 2 o 3 horas antes de acostarte y que, dentro de tus posibilidades, vayas adelantando el último bocado.", "Dejar de cenar.", "Cenar abundante para dormir mejor."], "a": 1, "e": "De noche, la misma comida eleva más la glucemia y puede empeorar el sueño. Si hoy cenás a las 22.30, una hora menos ya es un gran paso."}, {"t": "Laura pesa 90 kg, y un peso saludable para ella es 70 kg. ¿Cuál es su rango de proteína diaria?", "o": ["84 a 140 g.", "54 a 90 g.", "108 a 180 g.", "Exactamente 200 g."], "a": 0, "e": "La cuenta se hace con el peso objetivo: 70 × 1,2 = 84 g y 70 × 2 = 140 g."}, {"t": "Si no llegás a tu meta de proteínas, ¿qué conviene hacer primero?", "o": ["Tomar un suplemento en polvo.", "Nada: las proteínas no importan tanto.", "Comer barritas proteicas.", "Sumar alimentos ricos en proteína: un huevo más, una porción más grande de carne, pescado o legumbres, queso o yogur."], "a": 3, "e": "En la comida real, la proteína viene acompañada de otros nutrientes. El suplemento es el último recurso."}, {"t": "Sobre el agua, ¿cuál es la opción correcta?", "o": ["Hay que tomar 3 litros por día, siempre.", "En la mayoría de los casos, la mejor guía es la sed. Conviene planificar la hidratación con calor, ejercicio exigente, edad avanzada y en las primeras semanas del cambio alimentario.", "El mate y el café no cuentan como líquido.", "Conviene anticiparse siempre a la sed."], "a": 1, "e": "Señales de que te falta agua: orinar menos de 6 veces por día, orina oscura y sentirte un poco sediento todo el día."}, {"t": "El agua con gas hidrata igual que la común.", "o": [], "tf": true, "a": 0, "e": "No hay evidencia de que descalcifique los huesos: esa asociación se vio con las gaseosas cola."}], "caps": "El sistema de buenos hábitos y El marco y el algoritmo", "repaso": "El sistema de buenos hábitos y El marco y el algoritmo"}, {"n": 5, "title": "Nutrición: los escenarios, la adaptación y los alimentos bajo la lupa", "part": "Segunda parte. Cómo ganar salud", "q": [{"t": "Según el índice cintura/altura, tu cintura debería medir menos de…", "o": ["La mitad de tu altura.", "Tu altura.", "Un tercio de tu altura.", "100 cm, para todos."], "a": 0, "e": "Por ejemplo, si medís 1,70 m, tu cintura debería estar por debajo de 85 cm."}, {"t": "¿Qué es un alimento de alta densidad nutricional?", "o": ["Uno con muchas calorías y muchos nutrientes.", "Cualquier producto light.", "Uno con pocas calorías y pocos nutrientes.", "Uno que aporta muchos nutrientes esenciales con pocas calorías. En la comida natural, la proteína es una buena brújula."], "a": 3, "e": "Sacian rápido y por mucho tiempo, aportan la energía justa y protegen la masa magra."}, {"t": "¿En qué grupo están todos en luz verde para perder grasa y cuidar músculo?", "o": ["Pan integral, arroz y palta.", "Pechuga, atún, huevo duro, yogur griego y lentejas.", "Almendras, banana y pasas de uva.", "Papa hervida, avena cocida y manzana."], "a": 1, "e": "La papa hervida, la avena cocida y la mayoría de las frutas están en amarillo; el pan, el arroz, las almendras y la palta, en rojo."}, {"t": "Si un alimento está en luz roja en el semáforo, significa que no es sano.", "o": [], "tf": true, "a": 1, "e": "El semáforo indica cuánto ayuda un alimento a perder grasa y cuidar músculo, no si es sano. Las almendras, la palta o el aceite de oliva son muy nutritivos."}, {"t": "¿Por qué ayuda acortar la ventana de comidas?", "o": ["Porque está demostrado que activa la autofagia en las personas.", "Porque desintoxica.", "Porque facilita comer menos sin contar calorías. Para cuidar el músculo, necesita proteína suficiente.", "Porque dentro de la ventana se puede comer cualquier cosa."], "a": 2, "e": "En los estudios, la pérdida de grasa es similar a la de una restricción calórica clásica. Para muchos, es más fácil de sostener."}, {"t": "En las primeras semanas con menos harinas y azúcares aparecen dolor de cabeza, fatiga y calambres. ¿Cuál es la explicación principal?", "o": ["Le falta azúcar al cerebro y es peligroso.", "Una alergia a la carne.", "Una intoxicación por proteínas.", "La pérdida de agua y sal, y un cuerpo que está reaprendiendo a usar la grasa como combustible."], "a": 3, "e": "Suele aliviarse con más agua y algo más de sal. Si tenés hipertensión, enfermedad renal o cardíaca, o tomás medicación, consultá antes de sumar sal."}, {"t": "Si usás insulina u otros medicamentos para la diabetes y querés empezar este plan, ¿qué corresponde?", "o": ["Seguir igual, sin avisar.", "Duplicar la dosis por las dudas.", "Hablarlo antes con tu médico: puede hacer falta ajustar la medicación enseguida para evitar hipoglucemias.", "Suspenderlos por tu cuenta."], "a": 2, "e": "Con las gliflozinas (como dapagliflozina o empagliflozina), además, una alimentación muy baja en carbohidratos o el ayuno aumentan el riesgo de cetoacidosis."}, {"t": "Sospechás que el trigo te cae mal. ¿Qué hacés primero?", "o": ["Descarto la celiaquía antes de sacarlo, porque si no, los análisis pueden dar falsamente normales.", "Lo saco de inmediato.", "Tomo probióticos.", "Nada."], "a": 0, "e": "Después, con supervisión, una prueba sin trigo de 4 a 6 semanas y una reintroducción gradual."}, {"t": "La mayoría de las personas con poca lactasa no tolera nada de leche.", "o": [], "tf": true, "a": 1, "e": "La mayoría tolera unos 12 g de lactosa por vez, más o menos un vaso de leche. Los fermentados, como el yogur y el kéfir, suelen tolerarse mejor."}], "caps": "Escenario 1, Adaptación al cambio, Escenario 2 y Bajo la lupa", "repaso": "Escenario 1, Adaptación al cambio, Escenario 2 y Bajo la lupa"}, {"n": 6, "title": "Entrenamiento físico", "part": "Segunda parte. Cómo ganar salud", "q": [{"t": "¿Cuál es la diferencia entre actividad física, ejercicio y entrenamiento?", "o": ["Son lo mismo.", "La actividad es cualquier movimiento; el ejercicio es un movimiento planificado y repetido para mejorar tu condición; el entrenamiento organiza esos ejercicios en un plan con progresión.", "El entrenamiento es solo para deportistas.", "El ejercicio es cualquier movimiento, como subir una escalera."], "a": 1, "e": ""}, {"t": "¿Qué enseña el ejemplo de levantarte de la cama para cepillarte los dientes?", "o": ["Que solo hay que entrenar cuando tenés ganas.", "Que el entrenamiento, como el cepillado, no tiene que gustarte: sus beneficios son enormes, no se obtienen de otro modo y con el tiempo se vuelve automático.", "Que es mejor entrenar de noche.", "Que el disfrute es un requisito para empezar."], "a": 1, "e": "El disfrute no es un requisito para empezar, pero sí un gran aliado para sostener: dentro de las opciones efectivas, elegí las que más disfrutes."}, {"t": "¿Qué significa la premisa “tiene que incomodar”?", "o": ["Que hay que entrenar hasta el dolor o la lesión.", "Que es solo para atletas.", "Que cuanto más suave, mejor.", "Que el estímulo tiene que ser lo bastante exigente para que el cuerpo se adapte, y que la exigencia tiene que crecer a medida que te adaptás, siempre sin dañar."], "a": 3, "e": "Como Milón de Crotona con su ternero: a medida que el estímulo crece, el cuerpo se adapta."}, {"t": "¿Quién puede ser tu médico/a de aptitud física (MAF)?", "o": ["Solo un médico deportólogo.", "Cualquier profesional con conocimiento y experiencia (profesor de educación física, kinesiólogo, médico, entre otros) que te ofrezca un plan individualizado, te haga progresar y con quien sientas que podés afiliarte.", "El dueño del gimnasio.", "Un influencer con muchos seguidores."], "a": 1, "e": "Lo llamo médico por su rol, no por su título."}, {"t": "¿Cuál es una señal de que tu entrenador NO es el adecuado?", "o": ["A los 6 meses seguís con casi las mismas pesas y hacés más o menos lo mismo que todos.", "Te evaluó antes de empezar.", "Ajusta el plan según tu evolución.", "Te hace progresar de forma segura."], "a": 0, "e": ""}, {"t": "¿Cuál es la capacidad madre, la que habilita y potencia a todas las demás?", "o": ["La flexibilidad.", "La velocidad.", "La fuerza.", "La resistencia."], "a": 2, "e": "Sin fuerza no hay movimiento. Por eso, la base es un cuerpo fuerte y funcional."}, {"t": "Si tu objetivo es la salud, ¿en qué debería basarse tu entrenamiento de fuerza?", "o": ["En máquinas que aíslan cada músculo.", "Solo en estiramientos.", "En los movimientos humanos fundamentales: transportar pesos, tirar con las piernas (bisagra de cadera), empujar con las piernas, y tirar y empujar con los brazos.", "En lo que haga el resto del gimnasio."], "a": 2, "e": "Las máquinas son útiles, por ejemplo para empezar con seguridad, pero la base deberían ser los movimientos fundamentales. Entrená para ser fuerte y funcional."}, {"t": "Si hoy no tenés acceso a un MAF, lo mejor es no hacer nada hasta encontrarlo.", "o": [], "tf": true, "a": 1, "e": "Caminá más y sumá ejercicios simples con tu peso corporal. Algo de actividad es mejor que nada."}, {"t": "Sobre los pasos diarios, ¿cuál es la opción correcta?", "o": ["Solo sirven a partir de 10.000.", "Los beneficios se notan desde unos 2.500 a 3.000 pasos, y la mayor parte se alcanza alrededor de 7.000 a 8.000.", "No tienen relación con la salud.", "Hacen falta más de 20.000."], "a": 1, "e": ""}], "caps": "Entrenamiento físico", "repaso": "Entrenamiento físico"}, {"n": 7, "title": "Entrenamiento mental", "part": "Segunda parte. Cómo ganar salud", "q": [{"t": "Una vez que somos adultos, el cerebro ya no cambia: nuestras reacciones y patrones de pensamiento son fijos.", "o": [], "tf": true, "a": 1, "e": "La plasticidad del cerebro permite entrenarlo, igual que un músculo."}, {"t": "¿Con qué dos verbos se resume la dinámica del entrenamiento mental?", "o": ["Controlar y reprimir.", "Olvidar y distraer.", "Conocer y transformar tu mente.", "Pensar en positivo y no sentir."], "a": 2, "e": ""}, {"t": "¿Qué hay en la base de la pirámide del entrenamiento mental que propone el libro?", "o": ["Psicofármacos para todos.", "Solo el psicoanálisis.", "Prácticas que podés hacer por tu cuenta: la meditación y un diario personal estructurado.", "Suplementos para la ansiedad."], "a": 2, "e": "Funcionan, son seguras, te vuelven protagonista y son económicas."}, {"t": "Sobre la medicación en la salud mental, ¿cuál es la opción correcta?", "o": ["Es mejor no usarla nunca.", "Funciona como un bastón: permite volver a caminar mientras se fortalece todo lo demás. Cuándo y cómo dejarla lo decide tu médico.", "Se deja apenas te sentís bien.", "Reemplaza al entrenamiento mental."], "a": 1, "e": ""}, {"t": "¿Qué combinación favorece el estado de flujo (flow)?", "o": ["Una actividad muy fácil y aburrida.", "Hacer muchas cosas a la vez.", "Mirar series durante horas.", "Una actividad que disfrutás y que tiene cierta dificultad, con objetivos claros y retroalimentación inmediata."], "a": 3, "e": ""}, {"t": "Si tocar la guitarra te hace fluir, eso reemplaza la meditación.", "o": [], "tf": true, "a": 1, "e": "El flujo complementa la meditación, pero no la reemplaza: son estados mentales en gran parte distintos."}, {"t": "Según el modelo de los tres sistemas, ¿cuál es el desequilibrio típico de nuestro tiempo?", "o": ["Sistemas de amenaza y de logro hipertrofiados, y un sistema de calma atrofiado.", "Mucha calma y poca alarma.", "Los tres equilibrados.", "Un sistema de logro casi apagado."], "a": 0, "e": "El entrenamiento mental y el cuidado de tus vínculos nutren el sistema de calma, que ayuda a regular a los otros dos."}, {"t": "¿Cuánto tiempo de práctica comprometida conviene darle a la meditación o al diario antes de evaluar si te sirven?", "o": ["Un día.", "Una semana.", "Alrededor de tres meses.", "Diez años."], "a": 2, "e": "Los mayores beneficios maduran de a poco. Y si no funciona, antes de descartarla, probá otras guías o formatos."}], "caps": "Entrenamiento mental", "repaso": "Entrenamiento mental"}, {"n": 8, "title": "Conexión natural", "part": "Segunda parte. Cómo ganar salud", "q": [{"t": "¿Qué luz natural es la más valiosa para poner en hora tu reloj?", "o": ["La del mediodía.", "La de la mañana, idealmente en la primera hora después de levantarte.", "La del atardecer.", "Da lo mismo."], "a": 1, "e": ""}, {"t": "¿Por qué conviene salir al aire libre aunque el día esté nublado?", "o": ["Porque un día nublado ilumina muchísimo más que cualquier ambiente interior.", "Para broncearse.", "Porque la vitamina D se forma igual a través del vidrio.", "No conviene: nublado no sirve."], "a": 0, "e": "Para sincronizar el reloj, la luz entra por los ojos. Alcanza con estar afuera (¡nunca mirando el sol de frente!)."}, {"t": "¿Qué conviene hacer a la noche?", "o": ["Encender luces blancas e intensas para estar despierto.", "Nada: la luz nocturna no influye.", "Dormirse con la tele encendida.", "Bajar la intensidad de las luces, preferir las cálidas, dejar las pantallas en la última hora y dormir en una habitación bien oscura."], "a": 3, "e": ""}, {"t": "¿Cómo debería ser tu habitación para dormir?", "o": ["Cálida, a unos 26 °C.", "Da igual.", "Con una luz tenue encendida toda la noche.", "Oscura, silenciosa y fresca (como referencia, entre 18 y 22 °C)."], "a": 3, "e": ""}, {"t": "Para dormir bien, lo único que importa es la cantidad de horas: los horarios regulares no influyen.", "o": [], "tf": true, "a": 1, "e": "Tu reloj aprende de la repetición. El desfasaje de los fines de semana (jet lag social) lo desorienta casi como un viaje."}, {"t": "Sobre la cafeína (café, mate, té, gaseosas cola), ¿cuál es la opción correcta?", "o": ["Si no notás su efecto, no te afecta el sueño.", "Su efecto dura más de lo que creemos. Como referencia, tomá el último café o mate cerca del mediodía o en la primera hora de la tarde.", "Es mejor tomarla de noche.", "Ayuda a dormir más profundo."], "a": 1, "e": ""}, {"t": "¿Qué efecto tiene el alcohol sobre el sueño?", "o": ["Lo mejora.", "Ninguno.", "Te “plancha” más rápido, pero fragmenta la segunda mitad de la noche y reduce el sueño REM.", "Aumenta el sueño REM."], "a": 2, "e": ""}, {"t": "¿Cuál es el tratamiento de primera elección para el insomnio crónico?", "o": ["Las benzodiacepinas.", "La melatonina.", "La terapia cognitivo-conductual para el insomnio (TCC-I).", "El sauna."], "a": 2, "e": "Para el insomnio crónico, el tratamiento de primera elección no es una pastilla. Si dormís mal tres o más noches por semana durante más de tres meses, consultá."}, {"t": "¿Cómo conviene pensar los fármacos y suplementos para dormir (hipnóticos, melatonina, valeriana, magnesio y otros)?", "o": ["Como la solución de fondo.", "Como algo que nunca hay que usar.", "En la mayoría de los casos, como una ayuda transitoria, igual que un yeso: sostiene mientras el hueso se consolida, pero no es lo que lo cura.", "Como un reemplazo de los buenos hábitos."], "a": 2, "e": "A veces son imprescindibles. La prioridad es consolidar nuevas rutinas para poder, con el tiempo, reducirlos o dejarlos, siempre de la mano de tu médico."}], "caps": "Conexión natural", "repaso": "Conexión natural"}, {"n": 9, "title": "Conexión social y ¿cómo empezar?", "part": "Segunda parte. Cómo ganar salud", "q": [{"t": "¿Qué encontró el Estudio de Harvard sobre el Desarrollo Adulto, que sigue a cientos de personas desde 1938?", "o": ["Que el colesterol es lo que mejor predice cómo envejecemos.", "Que los vínculos no influyen en la salud.", "Que quienes estaban más satisfechos con sus vínculos a los 50 años fueron los más sanos a los 80: esa satisfacción predijo el envejecimiento mejor que el colesterol.", "Que la felicidad depende sobre todo de los ingresos."], "a": 2, "e": "La calidez de nuestras relaciones va de la mano de la felicidad… y de la salud."}, {"t": "En un experimento de 2020, voluntarios pasaron diez horas sin contacto social y, en otra ocasión, diez horas sin comer. ¿Qué mostró su cerebro?", "o": ["Que la soledad no genera ninguna respuesta.", "Que las escenas sociales activaban en los “hambrientos de compañía” la misma zona de deseo y recompensa que la comida en los “hambrientos de comida”.", "Que el hambre de comida siempre es más fuerte.", "Que la soledad mejora la concentración."], "a": 1, "e": "El cerebro vive la soledad de forma parecida al hambre: la conexión social es una necesidad básica, como comer."}, {"t": "¿Qué propone el libro como base para nutrir tus vínculos?", "o": ["La autocompasión y animarte a ser vulnerable.", "Tener muchos seguidores.", "No mostrar nunca tus debilidades.", "Agradarle a todo el mundo."], "a": 0, "e": "Sobre esa base crecen la empatía y las acciones que buscan el beneficio mutuo."}, {"t": "La autocompasión vuelve a las personas más egoístas.", "o": [], "tf": true, "a": 1, "e": "En un estudio con parejas, las personas más autocompasivas eran descriptas como más cálidas, más respetuosas y menos controladoras."}, {"t": "¿Cuál NO es una de las cualidades de la empatía?", "o": ["Tomar la perspectiva del otro.", "No juzgar.", "Reconocer las emociones del otro y comunicarle que las reconocés.", "Darle enseguida un consejo para resolver su problema."], "a": 3, "e": "La empatía se apoya en la escucha plena: sin interrumpir y sin dar consejos que no te pidieron."}, {"t": "¿Qué propone “Primero los elefantes”?", "o": ["Cambiar todos los hábitos a la vez.", "Empezar por uno o dos hábitos de alto impacto que te sientas capaz de mover hoy.", "Empezar por lo más fácil, aunque impacte poco, como los suplementos.", "Esperar a tener más tiempo."], "a": 1, "e": "Cada animal es una decisión, y algunas pesan mucho más que otras."}, {"t": "¿Cuál de estos es un hábito de bajo impacto (una ardilla)?", "o": ["Dejar de fumar.", "Entrenar la fuerza.", "El sauna y la exposición al frío.", "Dormir al menos 7 horas."], "a": 2, "e": ""}, {"t": "A veces, el elefante más grande del arca no es un hábito. ¿Qué puede ser?", "o": ["Un conflicto personal sin resolver (una pareja, la familia, un trabajo asfixiante) que funciona como un cepo.", "La marca del yogur.", "El horario del gimnasio.", "El clima."], "a": 0, "e": "Liberarte no siempre significa irte: a veces es poner límites o transformar el vínculo. Muchas veces conviene apoyarte en un profesional."}], "caps": "Conexión social y ¿Cómo empezar? Primero los elefantes", "repaso": "Conexión social y ¿Cómo empezar? Primero los elefantes"}, {"n": 10, "title": "El desafío complejo y la mejor motivación", "part": "Tercera parte. Cómo sostener el cambio", "q": [{"t": "¿Cuál es la diferencia entre el desafío simple y el desafío complejo?", "o": ["El simple es cómo integrar los hábitos; el complejo, qué hacer.", "Son lo mismo.", "El simple es saber qué hacer; el complejo, cómo integrarlo a tu vida y, sobre todo, cómo sostenerlo.", "El simple es ir al médico; el complejo, tomar la medicación."], "a": 2, "e": ""}, {"t": "La mayoría de las personas que logran bajar de peso lo mantienen a largo plazo sin mayor esfuerzo.", "o": [], "tf": true, "a": 1, "e": "La mayoría recupera buena parte de lo perdido en los años siguientes. Entender esto de entrada te prepara para encarar el cambio de otra manera."}, {"t": "¿Por qué el autocuidado profundo no es una prioridad natural?", "o": ["Porque el cerebro evolucionó para priorizar el estatus, el cuidado de otros, procurar recursos y descansar. Su autocuidado es reactivo, y las enfermedades crónicas no hacen sonar la alarma.", "Porque elegimos ser perezosos.", "Porque falta información.", "Porque los médicos no lo recomiendan."], "a": 0, "e": ""}, {"t": "¿Qué enseña la metáfora de la máscara de oxígeno?", "o": ["Que priorizar tu salud es egoísta.", "Que tu autocuidado es la base que sostiene y potencia todo lo demás, incluido el cuidado de quienes querés.", "Que solo aplica en los aviones.", "Que primero hay que ayudar a los demás."], "a": 1, "e": ""}, {"t": "Antes de postergar tu autocuidado por otro asunto, ¿qué tres preguntas conviene hacerte?", "o": ["¿Tengo ganas? ¿Hace frío? ¿Qué van a decir?", "¿Lo hice ayer? ¿Lo hago mañana? ¿Lo dejo?", "¿Cuánto cuesta? ¿Quién paga? ¿Cuándo?", "¿Es realmente urgente? ¿Puede hacerlo otra persona? ¿Puede esperar unas horas?"], "a": 3, "e": "Y si la excepción es real, la alternativa no tiene por qué ser cero: diez minutos de caminata también cuentan."}, {"t": "¿Cuál de estas frases expresa una motivación basada en valores?", "o": ["“Tengo que bajar de peso para revertir mi diabetes.”", "“Si no entreno, mi médico me va a retar.”", "“Quiero ser un abuelo ágil, con energía para jugar con mis nietos. Comer bien es parte de ser ese abuelo.”", "“Voy al gimnasio para verme bien en el espejo.”"], "a": 2, "e": "En la mentalidad basada en metas, el hábito es un medio (tengo que). En la basada en valores, es la expresión de la persona que querés ser (quiero ser)."}, {"t": "Las metas no sirven para nada.", "o": [], "tf": true, "a": 1, "e": "Pueden ayudarte a empezar. Los valores son los que te ayudan a sostener."}, {"t": "¿Cuáles son los dos faros que propone el libro para descubrir tus valores?", "o": ["Tu dolor y tu yo futuro.", "La balanza y el espejo.", "La opinión de tu familia y la de tu médico.", "Las redes sociales y la publicidad."], "a": 0, "e": "Si hay dolor, hay valor: el dolor señala lo que de verdad te importa."}], "caps": "Un desafío complejo, Las prioridades naturales, Un nuevo modelo mental, La mejor motivación y Descubrí tus valores", "repaso": "Un desafío complejo, Las prioridades naturales, Un nuevo modelo mental, La mejor motivación y Descubrí tus valores"}, {"n": 11, "title": "Claves para construir nuevos hábitos", "part": "Tercera parte. Cómo sostener el cambio", "q": [{"t": "¿Cuál NO es una de las cinco claves del sistema que te sostiene?", "o": ["Los oasis grupales.", "La gradualidad.", "La perfección.", "La paciencia."], "a": 2, "e": "Las cinco claves son el oasis grupal, la gradualidad, la imperfección, la paciencia y un buen copiloto."}, {"t": "¿Qué es avanzar en modo ecualizador?", "o": ["Cambiar todo de un día para el otro.", "Avanzar de forma gradual y a tu ritmo, subiendo de a poco lo que te hace bien y bajando lo que te perjudica.", "No cambiar nada.", "Seguir el ritmo de otra persona."], "a": 1, "e": "El modo interruptor (un cambio radical) conviene en casos puntuales, como una diabetes de difícil control, siempre con acompañamiento médico."}, {"t": "¿Cuánto tarda un hábito nuevo en volverse automático?", "o": ["21 días, para todo el mundo.", "Nunca se vuelve automático.", "Exactamente un año.", "Depende mucho: en un estudio, la mitad tardó más de dos meses, con un rango de menos de tres semanas a más de ocho meses."], "a": 3, "e": ""}, {"t": "Un mal fin de semana arruina todo lo construido.", "o": [], "tf": true, "a": 1, "e": "El proceso no tiene por qué ser perfecto, y saltear una oportunidad aislada no frena la construcción del hábito. El riesgo real es que la pausa se vuelva costumbre."}, {"t": "¿Cuál es una señal de alarma al elegir a tu copiloto?", "o": ["Te promete resultados rápidos y sin esfuerzo, te da el mismo plan que a todos, quiere venderte productos o te sugiere dejar la medicación sin hablarlo con tu médico.", "Conecta empáticamente con vos.", "Estimula tu autonomía.", "Personaliza sus recomendaciones."], "a": 0, "e": ""}, {"t": "¿Con quién conviene compararte?", "o": ["Con tu pareja, si empezaron juntos.", "Con el amigo que progresa más rápido.", "Con vos mismo a lo largo de este proceso, mirando tus propios registros.", "Con vos mismo hace veinte años."], "a": 2, "e": "Cada organismo es un sistema complejo: el mismo plan da resultados distintos en cada persona."}, {"t": "¿Qué lugar ocupa la balanza para saber si el plan funciona?", "o": ["Es el único indicador confiable.", "Es una medida gruesa: conviene leerla junto con tu cintura, cómo te sentís, cómo rendís, cómo te queda la ropa y tus análisis.", "Nunca hay que pesarse.", "Hay que pesarse varias veces por día."], "a": 1, "e": ""}], "caps": "Claves para construir nuevos hábitos", "repaso": "Claves para construir nuevos hábitos"}, {"n": 12, "title": "Barreras, desvíos e ideas finales", "part": "Tercera parte. Cómo sostener el cambio", "q": [{"t": "¿Cuál de estas frases es típica del exceso de confianza?", "o": ["“Llevo cuatro meses impecable. Un par de excepciones este fin de semana no me van a mover la aguja.”", "“Soy un desastre, otra vez lo arruiné todo.”", "“Me cuesta, pero sigo.”", "“Hoy no pude, mañana retomo.”"], "a": 0, "e": "Sobreestimar el propio autocontrol lleva a coquetear con la tentación, y eso favorece las recaídas."}, {"t": "¿Cuál es el orden de los cinco pasos del protocolo para cambiar tu relación con la voz interior?", "o": ["Elegir, aceptar, detectar, evaluar y tomar distancia.", "Evaluar, elegir, detectar, aceptar y tomar distancia.", "Ignorar, negar, pelear, ganar y olvidar.", "Detectar y registrar, tomar distancia, aceptar, evaluar y elegir una respuesta alternativa."], "a": 3, "e": ""}, {"t": "¿Qué diferencia a la autoeficacia del exceso de confianza?", "o": ["Son lo mismo.", "El exceso de confianza es más útil.", "La autoeficacia es creer en vos de manera general.", "La autoeficacia se apoya en logros reales y comprobables, y te impulsa a seguir esforzándote. El exceso de confianza se apoya en la sensación de que ya no hace falta esforzarse."], "a": 3, "e": ""}, {"t": "Se acerca un pico de trabajo previsible. ¿Qué propone el libro?", "o": ["Abandonar los hábitos hasta que pase.", "Definir de antemano tu versión mínima, sostenerla durante el pico y agendar la vuelta a tu versión completa.", "Entrenar el doble antes.", "Dejar de dormir para rendir más."], "a": 1, "e": "Sostener el hábito en su mínima expresión es mucho mejor que abandonarlo y tener que empezar de cero."}, {"t": "Después de un asado, la balanza marca 2 kg más: eso significa que ganaste 2 kg de grasa.", "o": [], "tf": true, "a": 1, "e": "Casi todo es agua, glucógeno y comida que todavía está en el intestino. La grasa formada en una noche es mucho menos: unos pocos cientos de gramos como máximo."}, {"t": "Entonces, ¿qué explica mejor el aumento de peso a lo largo de los años en relación con lo social?", "o": ["Un único cumpleaños.", "El agua retenida.", "Los eventos que se empalman: cada uno deja un pequeño resto que, sumado a lo largo del año, ya no es pequeño.", "La genética, exclusivamente."], "a": 2, "e": ""}, {"t": "¿Cómo se distingue el hambre real del antojo?", "o": ["El antojo crece de a poco; el hambre aparece de golpe.", "No hay forma de distinguirlos.", "Son exactamente lo mismo.", "El hambre física suele crecer de a poco y se conforma con comida real; el antojo suele irrumpir de golpe y pide algo específico, como un dulce."], "a": 3, "e": "Si era hambre real, ¡comé! Comida real y sin culpa."}, {"t": "¿Qué lugar ocupan los edulcorantes?", "o": ["Son el destino: conviene usarlos siempre.", "Pueden servir como puente en la transición, pero conviene usarlos cada vez menos, sobre todo si la necesidad de algo dulce es frecuente.", "Están prohibidos.", "Eliminan los antojos para siempre."], "a": 1, "e": ""}, {"t": "Según las ideas finales del manual, ¿cómo conviene mirar las recaídas?", "o": ["Como un fracaso que obliga a empezar de cero.", "Como parte del camino: no son un fracaso, son información. Lo importante es volver, una y otra vez, a lo que te importa.", "Como la señal de que el plan no sirve para vos." var KEY="msp_examenes_v1";
var S;try{S=JSON.parse(localStorage.getItem(KEY))||{v:1,r:{}};}catch(e){S={v:1,r:{}};}
if(!S.r)S.r={};
var WA="5493462306304";
Object.keys(S.r).forEach(function(k){var r=S.r[k];if(r&&r.first==null&&r.tries===1)r.first=(r.last!=null?r.last:r.best);});
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
var hdr=document.getElementById("hdr"),main=document.getElementById("main");
var cur=null,qi=0,answers=[];
function fecha(iso){var d=new Date(iso);return d.getDate()+"/"+(d.getMonth()+1);}

function resumen(nm,sel){
  var d=new Date(),L=["*Mini exámenes · Mejor Sin Pastillas*","Paciente: "+nm,"Enviado el "+d.getDate()+"/"+(d.getMonth()+1)+"/"+d.getFullYear(),""],no=[];
  EX.forEach(function(e){var r=S.r[e.n],n=e.q.length;
    if(!r||sel.indexOf(e.n)<0)return;
    var p=[];
    p.push("1.er intento "+(r.first!=null?r.first+"/"+n:"sin dato"));
    if(r.tries>1)p.push("mejor "+r.best+"/"+n);
    p.push(r.tries+(r.tries===1?" intento":" intentos"));
    p.push("último "+fecha(r.date));
    L.push(e.n+". "+e.title+": "+p.join(" · "));
  });
  return L.join("\n");
}
function list(){
  hdr.innerHTML='<a href="../">‹ Mejor Sin Pastillas</a><h1>Mini exámenes</h1><p>Repasá lo aprendido en el libro.</p>';
  var h='<div class="intro">La clave es comprender, no obedecer. No hay nota ni aprobado: equivocarte acá también es aprender. Respondé sin mirar el libro y, después de cada pregunta, vas a ver el porqué y dónde repasarlo.</div>';
  var part=null;
  EX.forEach(function(e){
    if(e.part!==part){part=e.part;h+="<h2>"+esc(part)+"</h2>";}
    var r=S.r[e.n];
    h+='<button class="ex" data-ex="'+e.n+'"><span class="n">'+e.n+'</span><span class="txt"><b>'+esc(e.title)+"</b><small>"+e.q.length+" preguntas · "+esc(e.caps||"")+"</small></span>"+(r?'<span class="score">'+r.best+"/"+e.q.length+"<span>"+(r.tries>1?"mejor resultado":"hecho el "+fecha(r.date))+"</span></span>":"")+"</button>";
  });
  if(Object.keys(S.r).length){
    h+='<div class="card"><h3>Enviar resultados a mi médico</h3><p class="muted" style="margin:0 0 10px">Se abre WhatsApp con el resumen listo para enviar al Dr. Mauro Tortolo. Vos decidís si lo mandás.</p>'+
      '<label class="muted" for="nom">Tu nombre y apellido</label><input id="nom" autocomplete="name" value="'+esc(S.name||"")+'" style="display:block;width:100%;font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:4px 0 10px">'+
      '<p class="muted" style="margin:0 0 6px">Elegí qué exámenes enviar:</p><div id="sel" style="display:flex;flex-direction:column;gap:6px;margin-bottom:12px">'+
      EX.filter(function(e){return S.r[e.n];}).map(function(e){var r=S.r[e.n];return '<label style="display:flex;gap:10px;align-items:center;font-size:16px"><input type="checkbox" value="'+e.n+'" style="width:22px;height:22px;flex:none"><span>'+e.n+". "+esc(e.title)+' <span class="muted">('+r.best+"/"+e.q.length+")</span></span></label>";}).join("")+
      '</div><button class="btn" id="send">Enviar por WhatsApp</button><p class="muted" id="selmsg" style="margin:8px 0 0"></p></div>';
    h+='<button class="link" id="reset">Borrar mis resultados</button>';
  }
  h+='<footer>Dr. Mauro Tortolo · @mejorsinpastillas</footer>';
  main.innerHTML=h;main.scrollTop=0;
  main.querySelectorAll("[data-ex]").forEach(function(b){b.onclick=function(){start(+b.getAttribute("data-ex"));};});
  var sb=document.getElementById("send");if(sb)sb.onclick=function(){var inp=document.getElementById("nom"),nm=inp.value.trim();if(!nm){inp.focus();inp.placeholder="Escribí tu nombre para que sepa quién lo envía";return;}var sel=[].slice.call(document.querySelectorAll('#sel input:checked')).map(function(x){return +x.value;});if(!sel.length){document.getElementById("selmsg").textContent="Marcá al menos un examen.";return;}S.name=nm;save();location.href="https://wa.me/"+WA+"?text="+encodeURIComponent(resumen(nm,sel));};
  var r=document.getElementById("reset");if(r)r.onclick=function(){if(r.dataset.c){S={v:1,r:{},name:S.name};save();list();}else{r.dataset.c=1;r.textContent="Tocá de nuevo para confirmar";}};
}
function start(n){cur=EX[n-1];qi=0;answers=[];question();}
function header(){hdr.innerHTML='<button class="back" id="back">‹ Mini exámenes</button><h1>'+cur.n+". "+esc(cur.title)+"</h1><p>"+esc(cur.part)+"</p>";document.getElementById("back").onclick=list;}
function question(){
  header();
  var q=cur.q[qi],n=cur.q.length;
  var h='<div class="prog" role="progressbar" aria-valuenow="'+qi+'" aria-valuemin="0" aria-valuemax="'+n+'"><i style="width:'+(qi/n*100)+'%"></i></div><div class="qnum">Pregunta '+(qi+1)+" de "+n+(q.tf?" · Verdadero o falso":"")+'</div><p class="q">'+esc(q.t)+"</p>";
  if(q.tf)h+='<div class="opts tfrow"><button class="opt tf" data-o="0">Verdadero</button><button class="opt tf" data-o="1">Falso</button></div>';
  else h+='<div class="opts">'+q.o.map(function(o,i){return '<button class="opt" data-o="'+i+'"><span class="l">'+"abcd"[i]+')</span><span>'+esc(o)+"</span></button>";}).join("")+"</div>";
  h+='<div id="fb"></div>';
  main.innerHTML=h;main.scrollTop=0;
  main.querySelectorAll("[data-o]").forEach(function(b){b.onclick=function(){answer(+b.getAttribute("data-o"));};});
}
function answer(o){
  var q=cur.q[qi],ok=o===q.a;answers[qi]=ok;
  main.querySelectorAll("[data-o]").forEach(function(b){var i=+b.getAttribute("data-o");b.disabled=true;if(i===q.a)b.classList.add("correct");else if(i===o)b.classList.add("wrong");});
  var right=q.tf?(q.a===0?"Verdadero":"Falso"):("abcd"[q.a]+") "+q.o[q.a]);
  var praise=["¡Correcto!","¡Muy bien!","¡Exacto!","¡Bien ahí!"][qi%4];
  var h='<div class="fb '+(ok?"ok":"no")+'" role="status"><b>'+(ok?praise:"No es esa. La respuesta es: "+esc(right))+"</b>"+(q.e?esc(q.e):"")+"</div>";
  h+='<button class="btn" id="next">'+(qi<cur.q.length-1?"Siguiente pregunta":"Ver mi resultado")+"</button>";
  var fb=document.getElementById("fb");fb.innerHTML=h;
  document.getElementById("next").onclick=function(){qi++;if(qi<cur.q.length)question();else result();};
  setTimeout(function(){fb.scrollIntoView({behavior:"smooth",block:"nearest"});},50);
}
function result(){
  header();
  var n=cur.q.length,c=answers.filter(Boolean).length;
  var r=S.r[cur.n]||{best:0,tries:0};if(!r.tries){r.first=c;r.firstDate=new Date().toISOString();}r.best=Math.max(r.best,c);r.last=c;r.tries++;r.date=new Date().toISOString();S.r[cur.n]=r;save();
  var msg=c===n?"¡Todas bien! Comprendiste a fondo estos capítulos.":c>=n*0.7?"Muy bien. Repasá las que se te escaparon y vas a tenerlo claro.":"Buen punto de partida. Releé los capítulos y volvé a intentarlo cuando quieras: equivocarte también es aprender.";
  var h='<div class="card" style="text-align:center"><p class="big">'+c+" de "+n+'</p><p style="margin:4px 0 0">'+msg+"</p></div>";
  h+='<button class="btn" id="toSend" style="background:#25D366;color:#fff">Enviar este resultado a mi médico</button>';
  var miss=cur.q.map(function(q,i){return {q:q,i:i};}).filter(function(x){return !answers[x.i];});
  if(miss.length)h+='<div class="card"><h3>Para repasar</h3>'+miss.map(function(x){var q=x.q;return '<div class="miss"><b>'+(x.i+1)+". "+esc(q.t)+'</b><div class="muted">Respuesta: '+esc(q.tf?(q.a===0?"Verdadero":"Falso"):"abcd"[q.a]+") "+q.o[q.a])+"</div></div>";}).join("")+'<p class="muted" style="margin:10px 0 0">Capítulos: '+esc(cur.repaso||cur.caps||"")+".</p></div>";
  h+='<button class="btn" id="again">Volver a intentarlo</button><button class="btn ghost" id="toList">Ver todos los exámenes</button>';
  if(cur.n<EX.length)h+='<button class="btn ghost" id="nextEx">Siguiente: '+esc(EX[cur.n].title)+"</button>";
  main.innerHTML=h;main.scrollTop=0;
  document.getElementById("again").onclick=function(){start(cur.n);};
  document.getElementById("toSend").onclick=function(){var en=cur.n;if(S.name){location.href="https://wa.me/"+WA+"?text="+encodeURIComponent(resumen(S.name,[en]));return;}list();var k=document.querySelector('#sel input[value="'+en+'"]');if(k)k.checked=true;var c=document.getElementById("nom");if(c){c.scrollIntoView({block:"center"});c.focus();}};
  document.getElementById("toList").onclick=list;
  var ne=document.getElementById("nextEx");if(ne)ne.onclick=function(){start(cur.n+1);};
}
list();
if("serviceWorker" in navigator){try{navigator.serviceWorker.register("../sw.js",{scope:"../"});}catch(e){}}
})();
