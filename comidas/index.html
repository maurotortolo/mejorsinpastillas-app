<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#25348F">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../icons/icon-192.png">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mis comidas">
<title>Mis comidas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Carlito:wght@400;700&display=swap" rel="stylesheet">
<style>
/* Layout: app de una pantalla; encabezado azul marino, comidas del día en tarjetas con foto, barra de pestañas abajo. */
:root{
  --navy:#25348F; --green:#2F6B5B; --mint:#D6EFE6; --sand:#EFE9DC;
  --bg:#F5F6FA; --card:#FFFFFF; --ink:#1C2033; --muted:#5D6478; --line:#DDE1EC; --on:#FFFFFF;
  --font:"Carlito", Calibri, "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root{--navy:#8E9CF0;--green:#7CC9AE;--mint:#1F3A33;--sand:#2B2820;--bg:#11131C;--card:#1A1D2A;--ink:#E9EBF3;--muted:#A3A9BD;--line:#2C3042;--on:#11131C;color-scheme:dark}
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.4;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--green);outline-offset:2px}
.app{display:flex;flex-direction:column;height:100%;max-width:640px;margin:0 auto}
header{background:#25348F;color:#fff;padding:calc(14px + env(safe-area-inset-top)) 18px 14px}
header a.brand{font-size:12px;letter-spacing:.14em;text-transform:uppercase;opacity:.8;color:#fff;text-decoration:none}
header h1{margin:2px 0 0;font-size:26px}
header p{margin:4px 0 0;font-size:14px;opacity:.85}
main{flex:1;overflow-y:auto;padding:16px 16px 24px;display:flex;flex-direction:column;gap:14px}
main>*{flex-shrink:0}
nav{display:grid;grid-template-columns:repeat(2,1fr);background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{background:none;border:0;padding:10px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px;color:var(--muted)}
nav button svg{width:24px;height:24px}
nav button[aria-current="page"]{color:var(--navy);font-weight:700}
.banner{background:var(--sand);border-radius:12px;padding:12px 14px;font-size:15px;display:flex;flex-direction:column;gap:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.card h3{margin:0 0 8px;font-size:18px}
.muted{color:var(--muted);font-size:14px}
.daynav{display:flex;align-items:center;gap:8px;justify-content:space-between}
.daynav button{background:var(--card);border:1px solid var(--line);border-radius:10px;width:44px;height:44px;font-size:22px}
.daynav button:disabled{opacity:.35}
.daynav .lbl{text-align:center;flex:1}
.daynav .lbl b{display:block;font-size:19px}
.add{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.add .big{grid-column:1/-1;display:flex;align-items:center;justify-content:center;gap:10px;font-size:19px;padding:18px 16px}
.add .big svg{width:28px;height:28px}
.meals{display:flex;flex-direction:column;gap:10px}
.meal{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:left;width:100%}
.meal .ph{flex:none;width:96px;height:96px;border-radius:10px;object-fit:cover;background:var(--bg);display:grid;place-items:center;color:var(--muted);font-size:12px}
.meal .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.meal .tx b{font-size:17px}
.meal .nota{font-size:15px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
.meal .falta{font-size:14px;color:var(--navy);font-weight:700}
.chip{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--mint);color:var(--green)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--bg);border-radius:10px;min-width:44px;height:40px;padding:0 10px}
.seg button[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:var(--on);font-weight:700}
input[type=text],input[type=time],select,textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
input[type=time]{max-width:160px;height:40px}
label{font-size:14px;color:var(--muted);display:block;margin-bottom:4px}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:700;background:var(--navy);color:var(--on)}
.btn.sec{background:var(--mint);color:var(--green)}
.btn.ghost{background:none;color:var(--navy);border:1px solid var(--line)}
.btn:disabled{opacity:.5}
.btnrow{display:flex;gap:10px;flex-wrap:wrap}
.btnrow > *{flex:1}
.link{background:none;border:0;color:var(--muted);font-size:14px;text-decoration:underline;padding:4px 0;align-self:center}
.daysel{display:flex;flex-direction:column;gap:6px}
.daysel label{display:flex;align-items:center;gap:10px;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:0}
.daysel input{width:22px;height:22px;flex:none}
.daysel small{margin-left:auto;color:var(--muted);font-size:13px}
.preview{width:100%;max-height:300px;object-fit:contain;border-radius:12px;background:var(--bg)}
.sheet-bg{position:fixed;inset:0;background:rgba(10,12,25,.45);display:none;align-items:flex-end;justify-content:center;z-index:10}
.sheet-bg.open{display:flex}
.sheet{background:var(--card);width:100%;max-width:640px;border-radius:20px 20px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px;max-height:92%;overflow-y:auto}
.sheet h3{margin:0;font-size:22px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:15px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20;max-width:90%;text-align:center}
.toast.show{opacity:1}
@media (prefers-reduced-motion: reduce){.toast{transition:none}}
footer{text-align:center;color:var(--muted);font-size:12px;padding:4px 0 8px}
.sr{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
</style>
</head>
<body>
<div class="app">
  <header>
    <a class="brand" href="../">‹ Mejor Sin Pastillas</a>
    <h1 id="title">Mis comidas</h1>
    <p id="subtitle">Sacale una foto a cada comida antes de empezar.</p>
  </header>
  <main id="main"></main>
  <nav aria-label="Secciones">
    <button data-view="dia" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>Mis comidas</button>
    <button data-view="compartir"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3M7 8l5-5 5 5"/><path d="M5 13v6h14v-6"/></svg>Compartir</button>
  </nav>
</div>
<input type="file" id="fileCam" accept="image/*" capture="environment" class="sr" tabindex="-1" aria-hidden="true">
<input type="file" id="fileGal" accept="image/*" class="sr" tabindex="-1" aria-hidden="true">
<div class="sheet-bg" id="sheetBg" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
"use strict";
/* Las comidas se guardan solo en este teléfono, en IndexedDB (las fotos pesan demasiado para localStorage). */
var DBN="msp_comidas", ST="meals";
var PKEY="msp_planilla_v1", AKEY="msp_comidas_auto", NKEY="msp_nombre", HKEY="msp_comidas_ui";
var TIPOS=[["des","Desayuno"],["alm","Almuerzo"],["mer","Merienda"],["cen","Cena"],["col","Colación"]];
var SAT=[["=","= Justo"],["+","+ De más"],["-","− De menos"]];
var DIAS_L=["lunes","martes","miércoles","jueves","viernes","sábado","domingo"];
var MESES=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];

/* Fechas en hora local */
function ds(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function pd(s){var p=s.split("-");return new Date(+p[0],+p[1]-1,+p[2]);}
function addDays(s,n){var d=pd(s);d.setDate(d.getDate()+n);return ds(d);}
function today(){return ds(new Date());}
function dow(s){return (pd(s).getDay()+6)%7;}
function shortDate(s){var d=pd(s);return d.getDate()+" "+MESES[d.getMonth()];}
function hm(d){return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function tipoL(id){for(var i=0;i<TIPOS.length;i++)if(TIPOS[i][0]===id)return TIPOS[i][1];return "";}
function satL(v){return v==="="?"Quedé justo":v==="+"?"Comí de más":v==="-"?"Comí de menos":"";}
function guessTipo(t){var p=t.split(":"),m=(+p[0])*60+(+p[1]);if(m<11*60)return "des";if(m<15*60+30)return "alm";if(m<19*60+30)return "mer";return "cen";}
function getName(){try{return (localStorage.getItem(NKEY)||"").trim();}catch(e){return "";}}
function dayLabel(d){return d===today()?"Hoy":d===addDays(today(),-1)?"Ayer":DIAS_L[dow(d)].replace(/^./,function(c){return c.toUpperCase();});}

/* ---------- Base de datos ---------- */
var dbP=null;
function db(){
  if(dbP)return dbP;
  dbP=new Promise(function(res,rej){
    if(!window.indexedDB){rej(new Error("sin IndexedDB"));return;}
    var r=indexedDB.open(DBN,1);
    r.onupgradeneeded=function(){var d=r.result;if(!d.objectStoreNames.contains(ST)){var s=d.createObjectStore(ST,{keyPath:"id"});s.createIndex("day","day");}};
    r.onsuccess=function(){res(r.result);};r.onerror=function(){rej(r.error);};
  });
  return dbP;
}
function tx(mode,fn){return db().then(function(d){return new Promise(function(res,rej){var t=d.transaction(ST,mode),s=t.objectStore(ST),out=fn(s);t.oncomplete=function(){res(out&&out.result!==undefined?out.result:out);};t.onerror=function(){rej(t.error);};t.onabort=function(){rej(t.error);};});});}
function putMeal(m){return tx("readwrite",function(s){return s.put(m);});}
function delMeal(id){return tx("readwrite",function(s){return s.delete(id);});}
function getMeal(id){return tx("readonly",function(s){return s.get(id);});}
function mealsOf(day){return tx("readonly",function(s){return s.index("day").getAll(day);}).then(sortM);}
function allMeals(){return tx("readonly",function(s){return s.getAll();}).then(sortM);}
function sortM(xs){return (xs||[]).sort(function(a,b){return a.day===b.day?(a.time<b.time?-1:a.time>b.time?1:a.ts-b.ts):(a.day<b.day?-1:1);});}
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}

/* ---------- Primer y último bocado en La salud de mi día ---------- */
/* Solo completa el dato si está vacío o si lo había puesto esta herramienta; nunca pisa lo que la persona cargó a mano. */
function syncPlanilla(day){
  return mealsOf(day).then(function(ms){
    try{
      var raw=localStorage.getItem(PKEY), P=raw?JSON.parse(raw):{v:1,d:{},w:{},names:{},lastAct:{},lastTxt:{}};
      if(P.demo)return;
      if(!P.d)P.d={};
      var A=JSON.parse(localStorage.getItem(AKEY)||"{}"), prev=A[day]||{}, e=P.d[day]||{}, ch=false, now={};
      var times=ms.map(function(m){return m.time;}).sort();
      var want={pb:times[0]||null,ub:times.length?times[times.length-1]:null};
      ["pb","ub"].forEach(function(k){
        var cur=e[k]||null, mine=prev[k]||null;
        if(cur===null||cur===mine){
          if(want[k]){if(cur!==want[k]){e[k]=want[k];ch=true;}now[k]=want[k];}
          else if(cur!==null&&cur===mine){delete e[k];ch=true;}
        }
      });
      if(ch){if(Object.keys(e).length)P.d[day]=e;else delete P.d[day];localStorage.setItem(PKEY,JSON.stringify(P));}
      if(Object.keys(now).length)A[day]=now;else delete A[day];
      localStorage.setItem(AKEY,JSON.stringify(A));
    }catch(err){}
  });
}

/* ---------- Fotos: se achican antes de guardarlas ---------- */
function loadImg(file){return new Promise(function(res,rej){var u=URL.createObjectURL(file),i=new Image();i.onload=function(){res({img:i,url:u});};i.onerror=function(){URL.revokeObjectURL(u);rej(new Error("img"));};i.src=u;});}
function shrink(file){
  return loadImg(file).then(function(o){
    var i=o.img,MAX=1280,w=i.naturalWidth,h=i.naturalHeight,k=Math.min(1,MAX/Math.max(w,h));
    var c=document.createElement("canvas");c.width=Math.round(w*k);c.height=Math.round(h*k);
    c.getContext("2d").drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(o.url);
    return new Promise(function(res){c.toBlob(function(b){res(b||file);},"image/jpeg",0.72);});
  });
}

var toastT;
function toast(msg){var t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove("show");},2400);}
var UI={};try{UI=JSON.parse(localStorage.getItem(HKEY)||"{}");}catch(e){}
function saveUI(){try{localStorage.setItem(HKEY,JSON.stringify(UI));}catch(e){}}

var view="dia", curDay=today(), urls=[];
var main=document.getElementById("main");
function freeUrls(){urls.forEach(function(u){URL.revokeObjectURL(u);});urls=[];}
function objUrl(b){var u=URL.createObjectURL(b);urls.push(u);return u;}

function isIOS(){return /iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);}
function standalone(){return (window.matchMedia&&matchMedia("(display-mode: standalone)").matches)||navigator.standalone===true;}

/* ---------- MIS COMIDAS ---------- */
function renderDia(){
  var d=curDay;
  return mealsOf(d).then(function(ms){
    freeUrls();
    var h="";
    if(isIOS()&&!standalone()&&!UI.hideIOS)h+='<div class="banner"><div><b>Instalala en tu iPhone.</b> Tocá Compartir en Safari y elegí <b>Agregar a pantalla de inicio</b>. Si no la instalás, el iPhone puede borrar tus fotos cuando pasan unos días sin usarla.</div><div><button class="btn ghost" id="hideIOS">Entendido</button></div></div>';
    if(!UI.hideIntro)h+='<div class="banner"><div><b>Cómo registrar tus comidas</b><br>1. Sacale una foto al plato <b>antes de empezar</b>, con un cubierto o tu mano al lado para que se vea el tamaño.<br>2. Escribí en una línea qué es y cuánto, sobre todo lo que no se ve: aceite, azúcar, salsas, bebidas.<br>3. Antes de la consulta, compartí tu registro con tu médico desde la pestaña Compartir.</div><div><button class="btn ghost" id="hideIntro">Entendido</button></div></div>';
    h+='<div class="daynav"><button id="prevDay" aria-label="Día anterior">‹</button><div class="lbl"><b>'+dayLabel(d)+'</b><span class="muted">'+DIAS_L[dow(d)]+" "+shortDate(d)+'</span></div><button id="nextDay" aria-label="Día siguiente"'+(d>=today()?" disabled":"")+'>›</button></div>';
    h+='<div class="add"><button class="btn big" id="addCam"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>Sacar foto</button><button class="btn sec" id="addGal">Elegir de la galería</button><button class="btn ghost" id="addTxt">Anotar sin foto</button></div>';
    if(ms.length){
      var t=ms.map(function(m){return m.time;});
      h+='<p class="muted" style="margin:0">'+ms.length+(ms.length===1?" comida":" comidas")+" · primer bocado "+t[0]+(ms.length>1?" · último "+t[t.length-1]:"")+"</p>";
      h+='<div class="meals">'+ms.map(function(m){
        var ph=m.foto?'<img class="ph" alt="Foto de '+esc(tipoL(m.tipo)||"la comida")+'" src="'+objUrl(m.foto)+'">':'<span class="ph">Sin foto</span>';
        return '<button class="meal" data-edit="'+m.id+'">'+ph+'<span class="tx"><b>'+m.time+" · "+esc(tipoL(m.tipo)||"Comida")+'</b>'+(m.nota?'<span class="nota">'+esc(m.nota)+"</span>":'<span class="falta">Tocá para contar qué es y cuánto</span>')+(m.sat?'<span><span class="chip">'+satL(m.sat)+"</span></span>":"")+"</span></button>";
      }).join("")+"</div>";
    }else h+='<p class="muted" style="margin:0;text-align:center">Todavía no registraste comidas '+(d===today()?"hoy":"este día")+".</p>";
    h+='<footer>Dr. Mauro Tortolo · @mejorsinpastillas</footer>';
    main.innerHTML=h;
    on("prevDay",function(){curDay=addDays(curDay,-1);render();});
    on("nextDay",function(){if(curDay<today()){curDay=addDays(curDay,1);render();}});
    on("addCam",function(){document.getElementById("fileCam").click();});
    on("addGal",function(){document.getElementById("fileGal").click();});
    on("addTxt",function(){addMeal(null,null);});
    on("hideIOS",function(){UI.hideIOS=true;saveUI();render();});
    on("hideIntro",function(){UI.hideIntro=true;saveUI();render();});
    main.querySelectorAll("[data-edit]").forEach(function(b){b.onclick=function(){openMeal(b.getAttribute("data-edit"),false);};});
  });
}
function on(id,fn){var e=document.getElementById(id);if(e)e.onclick=fn;}

function newId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
/* Hora de la comida: ahora si es hoy; si la foto es de la galería y es del mismo día, la hora de la foto. */
function mealTime(file){
  var now=new Date();
  if(file&&file.lastModified){var fd=new Date(file.lastModified);if(ds(fd)===curDay&&!(curDay===today()&&now-fd<60000))return hm(fd);}
  return curDay===today()?hm(now):"12:00";
}
function addMeal(file,blob){
  var t=mealTime(file);
  var m={id:newId(),day:curDay,time:t,ts:Date.now(),tipo:guessTipo(t),nota:"",sat:"",foto:blob||null};
  return putMeal(m).then(function(){return syncPlanilla(m.day);}).then(function(){render();openMeal(m.id,true);}).catch(function(){toast("No se pudo guardar. Revisá que tengas espacio en el teléfono.");});
}
function onFile(e){
  var f=e.target.files&&e.target.files[0];e.target.value="";if(!f)return;
  toast("Guardando foto…");
  shrink(f).then(function(b){return addMeal(f,b);},function(){toast("No se pudo leer esa imagen. Probá con otra.");});
}
document.getElementById("fileCam").onchange=onFile;
document.getElementById("fileGal").onchange=onFile;

/* ---------- Hoja para completar o corregir una comida ---------- */
var sheetBg=document.getElementById("sheetBg"),sheet=document.getElementById("sheet"),sheetUrl=null;
function closeSheet(){sheetBg.classList.remove("open");if(sheetUrl){URL.revokeObjectURL(sheetUrl);sheetUrl=null;}}
sheetBg.addEventListener("click",function(e){if(e.target===sheetBg)closeSheet();});
document.addEventListener("keydown",function(e){if(e.key==="Escape")closeSheet();});
function openMeal(id,isNew){
  getMeal(id).then(function(m){
    if(!m)return;
    var st={tipo:m.tipo,sat:m.sat,tipoHand:!isNew};
    if(sheetUrl)URL.revokeObjectURL(sheetUrl);sheetUrl=m.foto?URL.createObjectURL(m.foto):null;
    function seg(name,opts,v){return '<div class="seg" role="group" aria-label="'+name+'">'+opts.map(function(o){return '<button data-'+name+'="'+o[0]+'" aria-pressed="'+(v===o[0])+'">'+o[1]+"</button>";}).join("")+"</div>";}
    sheet.innerHTML='<h3 id="sheetTitle">'+(isNew?(m.foto?"Foto guardada":"Nueva comida"):"Tu comida")+"</h3>"+
      (sheetUrl?'<img class="preview" alt="Foto de la comida" src="'+sheetUrl+'">':"")+
      '<div><label>¿Qué comida es?</label>'+seg("tipo",TIPOS,st.tipo)+"</div>"+
      '<div><label for="mTime">Hora</label><input type="time" id="mTime" value="'+m.time+'"></div>'+
      '<div><label for="mNota">¿Qué es y cuánto?</label><textarea id="mNota" rows="3" placeholder="Por ejemplo: milanesa de pollo al horno, ensalada de tomate con 1 cucharada de aceite y un vaso de agua">'+esc(m.nota)+"</textarea></div>"+
      '<div><label>¿Cómo quedaste?</label>'+seg("sat",SAT,st.sat)+"</div>"+
      '<div class="btnrow"><button class="btn" id="mSave">Guardar</button></div><button class="link" id="mDel">Borrar esta comida</button>';
    sheetBg.classList.add("open");
    sheet.querySelectorAll("[data-tipo]").forEach(function(b){b.onclick=function(){st.tipo=b.getAttribute("data-tipo");st.tipoHand=true;sheet.querySelectorAll("[data-tipo]").forEach(function(x){x.setAttribute("aria-pressed",x===b);});};});
    document.getElementById("mTime").onchange=function(e){if(st.tipoHand||!e.target.value)return;st.tipo=guessTipo(e.target.value);sheet.querySelectorAll("[data-tipo]").forEach(function(x){x.setAttribute("aria-pressed",x.getAttribute("data-tipo")===st.tipo);});};
    sheet.querySelectorAll("[data-sat]").forEach(function(b){b.onclick=function(){var v=b.getAttribute("data-sat");st.sat=st.sat===v?"":v;sheet.querySelectorAll("[data-sat]").forEach(function(x){x.setAttribute("aria-pressed",x.getAttribute("data-sat")===st.sat);});};});
    document.getElementById("mSave").onclick=function(){
      m.time=document.getElementById("mTime").value||m.time;m.tipo=st.tipo;m.sat=st.sat;m.nota=document.getElementById("mNota").value.trim();
      putMeal(m).then(function(){return syncPlanilla(m.day);}).then(function(){closeSheet();render();toast("Guardado");},function(){toast("No se pudo guardar");});
    };
    document.getElementById("mDel").onclick=function(){
      sheet.innerHTML='<h3 id="sheetTitle">Borrar comida</h3><p style="margin:0">¿Seguro que querés borrar esta comida'+(m.foto?" y su foto":"")+'? No se puede deshacer.</p><div class="btnrow"><button class="btn ghost" id="cfNo">Cancelar</button><button class="btn" id="cfYes">Borrar</button></div>';
      on("cfNo",function(){closeSheet();openMeal(m.id,false);});
      on("cfYes",function(){delMeal(m.id).then(function(){return syncPlanilla(m.day);}).then(function(){closeSheet();render();toast("Comida borrada");});});
    };
  });
}

/* ---------- COMPARTIR: una imagen por día, lista para mandar por WhatsApp ---------- */
var shareSel=null;
function renderCompartir(){
  return allMeals().then(function(all){
    freeUrls();
    var byDay={};all.forEach(function(m){(byDay[m.day]=byDay[m.day]||[]).push(m);});
    var days=Object.keys(byDay).sort().reverse().slice(0,21);
    if(!shareSel){shareSel={};days.slice(0,3).forEach(function(d){shareSel[d]=1;});}
    var h='<div class="card"><h3>Compartí tu registro con tu médico</h3><p class="muted" style="margin:0 0 10px">Elegí los días. Se arma una imagen por día con tus fotos, horarios y notas, lista para mandar por WhatsApp.</p>';
    if(!days.length)h+='<p style="margin:0">Todavía no tenés comidas registradas.</p></div>';
    else{
      h+='<div class="daysel">'+days.map(function(d){return '<label><input type="checkbox" data-day="'+d+'"'+(shareSel[d]?" checked":"")+">"+dayLabel(d)+" "+shortDate(d)+"<small>"+byDay[d].length+(byDay[d].length===1?" comida":" comidas")+"</small></label>";}).join("")+"</div>";
      h+='<div class="btnrow" style="margin-top:12px"><button class="btn" id="doShare">Compartir</button></div></div>';
    }
    h+='<div class="card"><h3>Tus fotos</h3><p class="muted" style="margin:0 0 10px">Se guardan solo en este teléfono y no se envían a ningún lado hasta que vos las compartís. Si cambiás de teléfono o borrás la app, se pierden.</p><button class="btn ghost" id="wipe"'+(all.length?"":" disabled")+'>Borrar todas mis comidas</button></div>';
    h+='<footer>Dr. Mauro Tortolo · @mejorsinpastillas</footer>';
    main.innerHTML=h;
    main.querySelectorAll("[data-day]").forEach(function(c){c.onchange=function(){var d=c.getAttribute("data-day");if(c.checked)shareSel[d]=1;else delete shareSel[d];};});
    on("doShare",function(){var sel=Object.keys(shareSel).filter(function(d){return byDay[d];}).sort();if(!sel.length){toast("Elegí al menos un día");return;}doShare(sel.map(function(d){return {day:d,meals:byDay[d]};}),this);});
    on("wipe",function(){
      sheet.innerHTML='<h3 id="sheetTitle">Borrar todo</h3><p style="margin:0">¿Seguro que querés borrar todas tus comidas y fotos? No se puede deshacer.</p><div class="btnrow"><button class="btn ghost" id="cfNo">Cancelar</button><button class="btn" id="cfYes">Borrar todo</button></div>';
      sheetBg.classList.add("open");on("cfNo",closeSheet);
      on("cfYes",function(){var ds_={};all.forEach(function(m){ds_[m.day]=1;});tx("readwrite",function(s){return s.clear();}).then(function(){return Promise.all(Object.keys(ds_).map(syncPlanilla));}).then(function(){closeSheet();shareSel=null;render();toast("Comidas borradas");});});
    });
  });
}
function wrap(ctx,text,maxW){var words=String(text).split(/\s+/),lines=[],cur="";words.forEach(function(w){var t=cur?cur+" "+w:w;if(ctx.measureText(t).width>maxW&&cur){lines.push(cur);cur=w;}else cur=t;});if(cur)lines.push(cur);return lines;}
function blobImg(b){return new Promise(function(res){if(!b){res(null);return;}var u=URL.createObjectURL(b),i=new Image();i.onload=function(){res({i:i,u:u});};i.onerror=function(){URL.revokeObjectURL(u);res(null);};i.src=u;});}
function dayImage(day,meals){
  var W=1080,P=48,PH=380,F='"Carlito",Calibri,"Segoe UI",Arial,sans-serif',nm=getName();
  return Promise.all(meals.map(function(m){return blobImg(m.foto);})).then(function(imgs){
    var c=document.createElement("canvas"),x=c.getContext("2d");
    x.font="30px "+F;
    var blocks=meals.map(function(m){var tx=W-P*2-PH-32;var lines=m.nota?wrap(x,m.nota,tx):["(sin descripción)"];return {lines:lines,h:Math.max(PH,56+lines.length*40+(m.sat?56:0))};});
    var HH=200,H=HH+P+blocks.reduce(function(s,b){return s+b.h+56;},0)+70;
    c.width=W;c.height=H;x=c.getContext("2d");
    x.fillStyle="#F5F6FA";x.fillRect(0,0,W,H);
    x.fillStyle="#25348F";x.fillRect(0,0,W,HH);
    x.fillStyle="#fff";x.font="bold 54px "+F;x.fillText("Mis comidas"+(nm?" · "+nm:""),P,92);
    x.font="34px "+F;x.globalAlpha=.85;var t=meals.map(function(m){return m.time;});
    x.fillText(DIAS_L[dow(day)].replace(/^./,function(c){return c.toUpperCase();})+" "+pd(day).getDate()+" de "+["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"][pd(day).getMonth()]+" · "+meals.length+(meals.length===1?" comida":" comidas")+" · "+t[0]+(t.length>1?" a "+t[t.length-1]:""),P,150);
    x.globalAlpha=1;
    var y=HH+P;
    meals.forEach(function(m,i){
      var b=blocks[i],im=imgs[i];
      x.fillStyle="#fff";x.strokeStyle="#DDE1EC";x.lineWidth=2;rr(x,P-16,y-16,W-2*P+32,b.h+32,24);x.fill();x.stroke();
      if(im){var s=Math.min(im.i.naturalWidth,im.i.naturalHeight);x.save();rr(x,P,y,PH,PH,16);x.clip();x.drawImage(im.i,(im.i.naturalWidth-s)/2,(im.i.naturalHeight-s)/2,s,s,P,y,PH,PH);x.restore();URL.revokeObjectURL(im.u);}
      else{x.fillStyle="#EEF0F6";rr(x,P,y,PH,PH,16);x.fill();x.fillStyle="#5D6478";x.font="30px "+F;x.textAlign="center";x.fillText("Sin foto",P+PH/2,y+PH/2+10);x.textAlign="left";}
      var tx=P+PH+32;
      x.fillStyle="#1C2033";x.font="bold 38px "+F;x.fillText(m.time+" · "+(tipoL(m.tipo)||"Comida"),tx,y+40);
      x.font="30px "+F;x.fillStyle=m.nota?"#1C2033":"#5D6478";b.lines.forEach(function(l,k){x.fillText(l,tx,y+92+k*40);});
      if(m.sat){var sy=y+92+b.lines.length*40+10,sl=satL(m.sat);x.font="bold 26px "+F;var sw=x.measureText(sl).width+32;x.fillStyle="#D6EFE6";rr(x,tx,sy-30,sw,44,22);x.fill();x.fillStyle="#2F6B5B";x.fillText(sl,tx+16,sy+2);}
      y+=b.h+56;
    });
    x.fillStyle="#5D6478";x.font="26px "+F;x.textAlign="center";x.fillText("Mejor sin pastillas · app.mejorsinpastillas.com",W/2,H-30);
    return new Promise(function(res){c.toBlob(function(bl){res(new File([bl],"comidas-"+day+".jpg",{type:"image/jpeg"}));},"image/jpeg",0.85);});
  });
}
function rr(x,a,b,w,h,r){x.beginPath();x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+h,r);x.arcTo(a+w,b+h,a,b+h,r);x.arcTo(a,b+h,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath();}
function doShare(sel,btn){
  btn.disabled=true;btn.textContent="Preparando…";
  var fontsReady=document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve();
  fontsReady.then(function(){return Promise.all(sel.map(function(s){return dayImage(s.day,s.meals);}));}).then(function(files){
    btn.disabled=false;btn.textContent="Compartir";
    var nm=getName(),txt="Mi registro de comidas"+(nm?" ("+nm+")":"")+": "+sel.map(function(s){return shortDate(s.day);}).join(", ")+".";
    try{if(navigator.canShare&&navigator.canShare({files:files})){navigator.share({files:files,title:"Mis comidas",text:txt}).catch(function(){});return;}}catch(e){}
    files.forEach(function(f){var a=document.createElement("a");a.href=URL.createObjectURL(f);a.download=f.name;document.body.appendChild(a);a.click();a.remove();});
    toast(files.length===1?"Imagen descargada: mandala por WhatsApp":"Imágenes descargadas: mandalas por WhatsApp");
  }).catch(function(){btn.disabled=false;btn.textContent="Compartir";toast("No se pudo preparar el registro");});
}

function render(){
  document.querySelectorAll("nav button").forEach(function(b){if(b.getAttribute("data-view")===view)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current");});
  document.getElementById("subtitle").textContent=view==="dia"?"Sacale una foto a cada comida antes de empezar.":"Mandale tu registro a tu médico.";
  var p=view==="dia"?renderDia():renderCompartir();
  p.catch(function(){main.innerHTML='<div class="banner"><div><b>Este navegador no permite guardar fotos.</b> Abrí la app desde Safari o Chrome e instalala en la pantalla de inicio.</div></div>';});
  main.scrollTop=0;
}
document.querySelectorAll("nav button").forEach(function(b){b.onclick=function(){view=b.getAttribute("data-view");render();};});
render();
if("serviceWorker" in navigator){try{navigator.serviceWorker.register("../sw.js",{scope:"../"});}catch(e){}}
})();
</script>
