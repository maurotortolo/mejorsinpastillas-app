<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#25348F">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../icons/icon-192.png">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Presión arterial">
<title>Presión arterial</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Carlito:wght@400;700&display=swap" rel="stylesheet">
<style>
/* Layout: app de una pantalla, encabezado azul marino, formulario de medición arriba, tabla como la del cuaderno, gráficos semanales, barra de pestañas abajo. */
:root{
  --navy:#25348F; --green:#2F6B5B; --mint:#D6EFE6; --sand:#EFE9DC;
  --bg:#F5F6FA; --card:#FFFFFF; --ink:#1C2033; --muted:#5D6478; --line:#DDE1EC;
  --good:#2F6B5B; --warn:#9A6A12; --alert:#B3261E; --alertbg:#FBE9E7;
  --font:"Carlito", Calibri, "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --navy:#8E9CF0; --green:#7CC9AE; --mint:#1F3A33; --sand:#2B2820;
    --bg:#11131C; --card:#1A1D2A; --ink:#E9EBF3; --muted:#A3A9BD; --line:#2C3042;
    --good:#7CC9AE; --warn:#E3B45A; --alert:#F2B8B5; --alertbg:#3A1E1C; color-scheme: dark;
  }
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.4;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--green);outline-offset:2px}
.app{display:flex;flex-direction:column;height:100%;max-width:560px;margin:0 auto}
header{background:#25348F;color:#fff;padding:calc(14px + env(safe-area-inset-top)) 18px 14px}
header .brand{font-size:12px;letter-spacing:.14em;text-transform:uppercase;opacity:.8;color:#fff;text-decoration:none}
header h1{margin:2px 0 0;font-size:26px;text-wrap:balance}
header p{margin:4px 0 0;font-size:14px;opacity:.85}
main{flex:1;overflow-y:auto;padding:16px 16px 24px;display:flex;flex-direction:column;gap:16px}
nav{display:grid;grid-template-columns:repeat(4,1fr);background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{background:none;border:0;padding:10px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px;color:var(--muted)}
nav button svg{width:24px;height:24px}
nav button[aria-current="page"]{color:var(--navy);font-weight:700}
.banner{background:var(--sand);border-radius:12px;padding:12px 14px;font-size:15px;display:flex;flex-direction:column;gap:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.card h3{margin:0 0 8px;font-size:18px}
.muted{color:var(--muted);font-size:14px}
select,input[type=text],input[type=number],input[type=date],input[type=time],textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);min-height:46px}
label{font-size:14px;color:var(--muted);display:block;margin-bottom:4px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:16px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:13px;color:var(--muted);font-weight:700}
.icon-btn{background:none;border:0;color:var(--muted);padding:4px 6px;font-size:14px;text-decoration:underline}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:700;background:var(--navy);color:#fff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn{color:#11131C}}
.btn.big{padding:16px;font-size:19px;width:100%}
.btn.sec{background:var(--mint);color:var(--good)}
.btn.ghost{background:none;color:var(--navy);border:1px solid var(--line)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row > *{flex:1}
.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:16px;font-size:14px;color:var(--muted);margin-top:6px;flex-wrap:wrap}
.legend i{display:inline-block;width:14px;height:4px;border-radius:2px;vertical-align:middle;margin-right:6px}
.sheet-bg{position:fixed;inset:0;background:rgba(10,12,25,.45);display:none;align-items:flex-end;justify-content:center;z-index:10}
.sheet-bg.open{display:flex}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px;max-height:92%;overflow-y:auto}
.sheet h3{margin:0;font-size:22px}
.quick{display:flex;gap:6px;flex-wrap:wrap}
.quick button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:8px 12px;font-size:15px}
.quick button[aria-pressed=true]{background:var(--navy);color:#fff;border-color:var(--navy)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .quick button[aria-pressed=true]{color:#11131C}}
.hint{background:var(--mint);color:var(--ink);border-radius:10px;padding:10px 12px;font-size:14px}
.alert{background:var(--alertbg);color:var(--ink);border-left:4px solid var(--alert);border-radius:10px;padding:10px 12px;font-size:15px}
.alert b{color:var(--alert)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:15px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20;max-width:90%;text-align:center}
.toast.show{opacity:1}
@media (prefers-reduced-motion: reduce){.toast{transition:none}}
footer{text-align:center;color:var(--muted);font-size:12px;padding:4px 0 8px}
.form{display:flex;flex-direction:column;gap:14px}
.meas{border-top:1px solid var(--line);padding-top:10px}
.meas h4{margin:0 0 8px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--green)}
.bp{display:grid;grid-template-columns:1fr 1fr .8fr;gap:8px;align-items:end}
.bp input{text-align:center;font-size:26px;font-weight:700;height:56px;font-variant-numeric:tabular-nums;padding:6px}
.bp label{text-align:center;margin-bottom:4px}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stats div{background:var(--bg);border-radius:10px;padding:10px 12px}
.stats b{display:block;font-size:24px;color:var(--green);font-variant-numeric:tabular-nums}
.stats span{font-size:14px;color:var(--muted)}
.tscroll{overflow-x:auto}
table.reg{font-size:15px}
table.reg td.v{white-space:nowrap;font-weight:700}
table.reg td.v small{display:block;font-weight:400;color:var(--muted);font-size:12px}
table.reg td.c{font-size:13px;color:var(--muted);min-width:110px}
table.reg button.d{background:none;border:0;padding:0;text-align:left;color:var(--navy);font-weight:700;text-decoration:underline;white-space:nowrap}
table.reg td.h{white-space:nowrap}
.sum{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.delta{flex:none;font-weight:700;font-size:15px;text-align:right;font-variant-numeric:tabular-nums}
.delta.up{color:var(--good)}.delta.down{color:var(--warn)}.delta.eq{color:var(--muted)}
details summary{cursor:pointer;font-weight:700;font-size:17px}
details ul{margin:8px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:15px}
.last{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.last b{font-size:18px}
.flag{font-size:12px;font-weight:700;color:var(--alert);margin-left:6px}
</style>
</head>
<body>
<div class="app">
  <header>
    <a class="brand" href="../">‹ Mejor Sin Pastillas</a>
    <h1>Mi presión arterial</h1>
    <p id="subtitle">Anotá cada medición con su fecha y hora.</p>
  </header>
  <main id="main"></main>
  <nav aria-label="Secciones">
    <button data-view="anotar" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.5-7 10-7 10z"/><path d="M12 9v6M9 12h6"/></svg>Anotar</button>
    <button data-view="registros"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M4 9h16M4 14h16M10 9v11"/></svg>Registros</button>
    <button data-view="evolucion"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19h16M5 7l4 4 4-3 6 7"/></svg>Evolución</button>
    <button data-view="mas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>Más</button>
  </nav>
</div>

<div class="sheet-bg" id="sheetBg" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="sheet" id="sheet"></div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
"use strict";
var KEY="msp_presion_v1";
var WA="5493462306304";
var DIAS=["dom","lun","mar","mié","jue","vie","sáb"];
var MESES=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
var CHIPS=["Antes de la medicación","Ya tomé la medicación","Mareos al pararme","Dolor de cabeza","Después de entrenar","Con estrés o nervios"];
var HOW=[
  "Con un tensiómetro automático de brazo (no de muñeca), validado clínicamente y con un manguito del tamaño adecuado para tu brazo.",
  "En los 30 minutos previos, sin café, mate, cigarrillo ni ejercicio. Con la vejiga vacía.",
  "Sentado, con la espalda apoyada, los pies en el piso y las piernas sin cruzar. El brazo apoyado sobre una mesa, a la altura del corazón (no colgando). También puede ser en posición acostada.",
  "Descansá cinco minutos antes de medir, y no hables durante la medición.",
  "Hacé dos mediciones, con un minuto de diferencia, y anotá las dos.",
  "¿Cuándo? A la mañana (antes de la medicación y del desayuno) y a la tarde o noche.",
  "<b>Si tomás medicación para la presión</b>, medila al menos una vez por semana. Cuando cambiás tus hábitos, la presión puede bajar rápido y a veces hay que ajustar la dosis enseguida. Si notás mareos al pararte o valores más bajos que de costumbre, consultá con tu médico. No modifiques la medicación por tu cuenta.",
  "<b>Si no tomás medicación y tu presión es normal</b> (menos de 120/80), alcanza con medirla cada seis meses. Las guías piden al menos una vez por año.",
  "<b>Si está algo elevada</b> (entre 120 y 129 de máxima), medila cada tres meses y comentalo con tu médico."
];

/* Fechas en hora local */
function pad(n){return String(n).padStart(2,"0");}
function ds(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
function pd(s){var p=s.split("-");return new Date(+p[0],+p[1]-1,+p[2]);}
function addDays(s,n){var d=pd(s);d.setDate(d.getDate()+n);return ds(d);}
function today(){return ds(new Date());}
function nowTime(){var d=new Date();return pad(d.getHours())+":"+pad(d.getMinutes());}
function monday(s){var d=pd(s);d.setDate(d.getDate()-(d.getDay()+6)%7);return ds(d);}
function shortDate(s){var d=pd(s);return d.getDate()+" "+MESES[d.getMonth()];}
function dayLabel(s){var d=pd(s);return DIAS[d.getDay()]+" "+d.getDate()+"/"+(d.getMonth()+1);}
function fullDate(s){var d=pd(s);return d.getDate()+"/"+(d.getMonth()+1)+"/"+String(d.getFullYear()).slice(2);}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function intOrNull(v){var x=parseInt(String(v).trim(),10);return isNaN(x)?null:x;}

/* regs: [{id,date,time,s1,d1,p1,s2,d2,p2,com}] · s = máxima (sistólica), d = mínima (diastólica), p = pulso. */
function blank(){return {v:1,demo:false,regs:[],nextId:1,goal:{s:"",d:""},name:""};}
function migrate(x){if(!x||typeof x!=="object")return blank();if(!x.v)x.v=1;/* futuras versiones: convertir aquí, nunca borrar campos */
  if(!x.regs)x.regs=[];if(!x.goal)x.goal={s:"",d:""};if(!x.nextId)x.nextId=x.regs.reduce(function(m,r){return Math.max(m,r.id+1);},1);return x;}
function demo(){
  var x=blank();x.demo=true;x.goal={s:"130",d:"80"};
  var start=addDays(monday(today()),-35),id=1,seed=7;
  function rnd(){seed=(seed*9301+49297)%233280;return seed/233280-0.5;}
  for(var i=0;i<42;i++){
    var d=addDays(start,i);if(d>today())break;
    var base=146-i*0.42,bd=93-i*0.27;
    var am={id:id++,date:d,time:"07:"+pad(10+Math.round((rnd()+0.5)*30)),s1:Math.round(base+4+rnd()*8),d1:Math.round(bd+2+rnd()*5),p1:Math.round(76-i*0.15+rnd()*6),com:""};
    am.s2=am.s1-Math.round(2+rnd()*3);am.d2=am.d1-Math.round(1+rnd()*2);am.p2=am.p1-2;
    if(i%7===0)am.com="Antes de la medicación";
    if(i===23)am.com="Mareos al pararme. Llamé al médico y me ajustó la dosis";
    x.regs.push(am);
    if(i%7!==2&&i%7!==5){var pm={id:id++,date:d,time:"21:"+pad(Math.round((rnd()+0.5)*45)),s1:Math.round(base-3+rnd()*8),d1:Math.round(bd-2+rnd()*5),p1:Math.round(72+rnd()*6),com:""};
      pm.s2=pm.s1-Math.round(1+rnd()*3);pm.d2=pm.d1-Math.round(rnd()*2+0.5);pm.p2=pm.p1-1;
      if(i===9)pm.com="Con estrés o nervios";x.regs.push(pm);}
  }
  x.regs=x.regs.filter(function(r){return r.date<today()||r.time<=nowTime();});
  x.nextId=id;return x;
}
var S;
try{var raw=localStorage.getItem(KEY);S=raw?migrate(JSON.parse(raw)):blank();}catch(e){S=blank();}
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
var storageOK=true;
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));storageOK=true;}catch(e){storageOK=false;}}

/* Cálculos */
function sorted(){return S.regs.slice().sort(function(a,b){return (a.date+a.time)<(b.date+b.time)?-1:1;});}
function regAvg(r){var s=[r.s1],d=[r.d1];if(r.s2!=null){s.push(r.s2);d.push(r.d2);}return {s:s.reduce(sum)/s.length,d:d.reduce(sum)/d.length};}
function sum(a,b){return a+b;}
function mean(list){if(!list.length)return null;var s=0,d=0;list.forEach(function(r){var a=regAvg(r);s+=a.s;d+=a.d;});return {s:s/list.length,d:d/list.length,n:list.length};}
function bpTxt(a){return a?Math.round(a.s)+"/"+Math.round(a.d):"—";}
function isAM(r){return r.time<"12:00";}
function weekly(){var g={};S.regs.forEach(function(r){var m=monday(r.date);(g[m]=g[m]||[]).push(r);});return Object.keys(g).sort().map(function(m){var a=mean(g[m]);return {k:m,s:a.s,d:a.d,n:a.n};});}
function flagOf(s,d){if(s>=180||d>=120)return "high";if(s<90||d<50)return "low";return "";}
function regFlag(r){var f=flagOf(r.s1,r.d1);if(r.s2!=null){var f2=flagOf(r.s2,r.d2);if(f2==="high"||!f)f=f2;}return f;}
function alertHTML(f){
  if(f==="high")return '<div class="alert" role="alert"><b>Es un valor muy alto.</b> Descansá cinco minutos, sentado y tranquilo, y volvé a medirla. Si sigue igual de alta, consultá hoy con tu médico. Si además tenés dolor en el pecho, falta de aire, un dolor de cabeza muy fuerte, cambios en la visión, dificultad para hablar o debilidad en un brazo o una pierna, llamá a emergencias (107) o andá a una guardia ya.</div>';
  if(f==="low")return '<div class="alert" role="alert"><b>Es un valor bajo.</b> Si tomás medicación para la presión, o si tenés mareos, sobre todo al pararte, o te sentís débil, consultá con tu médico. Cuando cambiás tus hábitos, a veces hay que ajustar la dosis. No modifiques la medicación por tu cuenta.</div>';
  return "";
}

var toastT;
function toast(msg){var t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove("show");},2400);}

var view="anotar",evoMode="sem",regLimit=40;
var main=document.getElementById("main");

function isIOS(){return /iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);}
function standalone(){return (window.matchMedia&&matchMedia("(display-mode: standalone)").matches)||navigator.standalone===true;}
function topNotices(){
  var h="";
  if(S.demo)return '<div class="banner"><div><b>Estás viendo un ejemplo</b> de seis semanas. Cuando anotes tu primera medición, el ejemplo se borra solo.</div><div><button class="btn" id="exitDemo">Salir del ejemplo</button></div></div>';
  if(isIOS()&&!standalone()&&!S.hideIOS){h+='<div class="banner"><div><b>Instalala en tu iPhone.</b> Tocá el botón Compartir de Safari y elegí <b>Agregar a pantalla de inicio</b>. Así tus registros quedan guardados. Si no la instalás, el iPhone puede borrarlos cuando pasan unos días sin usarla.</div><div><button class="btn ghost" id="hideIOS">Entendido</button></div></div>';}
  if(S.regs.length>=10){var lb=S.lastBackup?new Date(S.lastBackup):null;var days=lb?(Date.now()-lb.getTime())/864e5:999;if(days>30)h+='<div class="banner"><div><b>Hacé una copia de seguridad.</b> '+(lb?"Pasó más de un mes desde la última.":"Todavía no hiciste ninguna.")+' Si cambiás de teléfono, te va a permitir recuperar tus registros.</div><div><button class="btn" id="goBackup">Hacer copia ahora</button></div></div>';}
  return h;
}
function howHTML(open){return '<details class="card"'+(open?" open":"")+'><summary>¿Cómo medirla?</summary><ul>'+HOW.map(function(t){return "<li>"+t+"</li>";}).join("")+"</ul></details>";}

/* Formulario de una medición (pfx: "f" en la pantalla, "e" en la hoja de edición) */
function formHTML(r,pfx){
  r=r||{};
  function bp(n,title){
    return '<div class="meas"><h4>'+title+'</h4><div class="bp">'+
      '<div><label for="'+pfx+"s"+n+'">Máxima</label><input id="'+pfx+"s"+n+'" type="number" inputmode="numeric" min="50" max="280" placeholder="120" value="'+(r["s"+n]!=null?r["s"+n]:"")+'"></div>'+
      '<div><label for="'+pfx+"d"+n+'">Mínima</label><input id="'+pfx+"d"+n+'" type="number" inputmode="numeric" min="30" max="180" placeholder="80" value="'+(r["d"+n]!=null?r["d"+n]:"")+'"></div>'+
      '<div><label for="'+pfx+"p"+n+'">Pulso</label><input id="'+pfx+"p"+n+'" type="number" inputmode="numeric" min="30" max="220" placeholder="—" value="'+(r["p"+n]!=null?r["p"+n]:"")+'"></div></div></div>';
  }
  var com=r.com||"";
  return '<div class="form" data-form="'+pfx+'">'+
    '<div class="row"><div><label for="'+pfx+'Date">Fecha</label><input id="'+pfx+'Date" type="date" max="'+today()+'" value="'+(r.date||today())+'"></div><div><label for="'+pfx+'Time">Hora</label><input id="'+pfx+'Time" type="time" value="'+(r.time||nowTime())+'"></div></div>'+
    bp(1,"1ª medición")+bp(2,"2ª medición, un minuto después")+
    '<p class="muted" style="margin:-6px 0 0">Máxima y mínima en mmHg. El pulso es opcional.</p>'+
    '<div id="'+pfx+'Alert"></div>'+
    '<div class="meas"><h4>Medicación y comentarios</h4><div class="quick" role="group" aria-label="Comentarios rápidos">'+CHIPS.map(function(c){return '<button type="button" data-chip="'+esc(c)+'" aria-pressed="'+(com.indexOf(c)>=0)+'">'+esc(c)+"</button>";}).join("")+'</div>'+
    '<label for="'+pfx+'Com" style="margin-top:10px">Otros comentarios (opcional)</label><input id="'+pfx+'Com" type="text" value="'+esc(com)+'" placeholder="Por ejemplo: dormí mal, cambio de dosis"></div>'+
  "</div>";
}
function bindForm(pfx){
  var box=document.querySelector('[data-form="'+pfx+'"]'),com=document.getElementById(pfx+"Com");
  function parts(){return com.value.split(/\.\s*/).map(function(t){return t.trim();}).filter(Boolean);}
  box.querySelectorAll("[data-chip]").forEach(function(b){b.onclick=function(){
    var c=b.getAttribute("data-chip"),p=parts(),i=p.indexOf(c);
    if(i>=0)p.splice(i,1);else p.push(c);
    com.value=p.join(". ");b.setAttribute("aria-pressed",i<0);};});
  com.oninput=function(){var p=parts();box.querySelectorAll("[data-chip]").forEach(function(b){b.setAttribute("aria-pressed",p.indexOf(b.getAttribute("data-chip"))>=0);});};
  function live(){var r=readForm(pfx,true),f="";if(r&&typeof r==="object")f=regFlag(r);document.getElementById(pfx+"Alert").innerHTML=alertHTML(f);}
  ["s1","d1","s2","d2"].forEach(function(k){var el=document.getElementById(pfx+k);el.addEventListener("input",live);});
  /* Al escribir tres cifras en la máxima, pasa sola a la mínima */
  [1,2].forEach(function(n){var s=document.getElementById(pfx+"s"+n);s.addEventListener("input",function(){if(String(s.value).length>=3)document.getElementById(pfx+"d"+n).focus();});});
  live();
}
/* Devuelve la medición o un texto de error. quiet: no valida campos incompletos. */
function readForm(pfx,quiet){
  function g(k){return intOrNull(document.getElementById(pfx+k).value);}
  var r={date:document.getElementById(pfx+"Date").value||today(),time:document.getElementById(pfx+"Time").value||nowTime(),
    s1:g("s1"),d1:g("d1"),p1:g("p1"),s2:g("s2"),d2:g("d2"),p2:g("p2"),com:document.getElementById(pfx+"Com").value.trim()};
  if(quiet){if(r.s1==null||r.d1==null||r.s1<50||r.d1<25)return null;if(r.s2!=null&&(r.d2==null||r.s2<50||r.d2<25)){r.s2=null;r.d2=null;}return r;}
  if(r.date>today())return "La fecha no puede ser posterior a hoy";
  if(r.s1==null||r.d1==null)return "Completá la máxima y la mínima de la 1ª medición";
  if((r.s2==null)!==(r.d2==null))return "En la 2ª medición, completá la máxima y la mínima (o dejá las dos vacías)";
  for(var n=1;n<=2;n++){var s=r["s"+n],d=r["d"+n],p=r["p"+n];if(s==null)continue;
    if(s<50||s>280||d<25||d>180)return "Revisá los valores de la "+n+"ª medición";
    if(d>=s)return "En la "+n+"ª medición, la máxima tiene que ser mayor que la mínima";
    if(p!=null&&(p<25||p>230))return "Revisá el pulso de la "+n+"ª medición";}
  if(r.s2==null){r.s2=null;r.d2=null;r.p2=null;}
  return r;
}

/* Gráfico de dos líneas: máxima y mínima */
function chart(pts){
  var n=pts.length,W=330,H=220,pl=34,pr=14,pt=22,pb=30;
  var vals=[];pts.forEach(function(p){vals.push(p.s,p.d);});
  var gs=intOrNull(S.goal.s),gd=intOrNull(S.goal.d);if(gs)vals.push(gs);if(gd)vals.push(gd);
  var mn=Math.floor((Math.min.apply(null,vals)-6)/10)*10,mx=Math.ceil((Math.max.apply(null,vals)+6)/10)*10;
  var step=(mx-mn)>80?20:10;
  function x(i){return pl+(W-pl-pr)*(n===1?0.5:i/(n-1));}
  function y(v){return pt+(H-pt-pb)*(1-(v-mn)/(mx-mn));}
  var g="";
  for(var v=mn;v<=mx;v+=step){g+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y(v)+'" y2="'+y(v)+'" stroke="var(--line)"/><text x="'+(pl-6)+'" y="'+(y(v)+4)+'" text-anchor="end" font-size="10" fill="var(--muted)">'+v+"</text>";}
  [[gs,"var(--navy)"],[gd,"var(--green)"]].forEach(function(o){if(o[0])g+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y(o[0])+'" y2="'+y(o[0])+'" stroke="'+o[1]+'" stroke-dasharray="5 4" opacity=".7"/>';});
  [["s","var(--navy)"],["d","var(--green)"]].forEach(function(o){
    var k=o[0],c=o[1],line=pts.map(function(p,i){return x(i)+","+y(p[k]);}).join(" ");
    g+='<polyline points="'+line+'" fill="none" stroke="'+c+'" stroke-width="2.5" stroke-linejoin="round"/>';
    if(n<=16)pts.forEach(function(p,i){var last=i===n-1;g+='<circle cx="'+x(i)+'" cy="'+y(p[k])+'" r="'+(last?5:3.2)+'" fill="'+(last?c:"var(--card)")+'" stroke="'+c+'" stroke-width="2"/>';});
    var lp=pts[n-1];g+='<text x="'+Math.min(x(n-1),W-pr)+'" y="'+(k==="s"?y(lp.s)-10:y(lp.d)+18)+'" text-anchor="end" font-size="12" font-weight="700" fill="'+c+'">'+Math.round(lp[k])+"</text>";
  });
  var every=Math.max(1,Math.ceil(n/6));
  pts.forEach(function(p,i){if((n-1-i)%every===0)g+='<text x="'+x(i)+'" y="'+(H-10)+'" text-anchor="middle" font-size="10.5" fill="var(--muted)">'+esc(p.l)+"</text>";});
  return '<div class="chart"><svg viewBox="0 0 '+W+" "+H+'" role="img" aria-label="Presión máxima y mínima">'+g+'</svg></div><div class="legend"><span><i style="background:var(--navy)"></i>Máxima</span><span><i style="background:var(--green)"></i>Mínima</span>'+(gs||gd?'<span><i style="background:repeating-linear-gradient(90deg,var(--muted) 0 4px,transparent 4px 7px)"></i>Tu objetivo</span>':"")+"</div>";
}

/* Si la persona registra su peso en La salud de mi día, se muestran juntos: es el efecto de los hábitos en la presión. */
function pesoCard(wk){
  var P;try{P=JSON.parse(localStorage.getItem("msp_planilla_v1"));}catch(e){P=null;}
  if(S.demo||!P||P.demo||!P.w||wk.length<2)return "";
  var both=wk.filter(function(w){return P.w[w.k]&&P.w[w.k].peso!=null&&P.w[w.k].peso!=="";});
  if(both.length<2)return "";
  var a=both[0],b=both[both.length-1],pa=+P.w[a.k].peso,pb=+P.w[b.k].peso,dp=Math.round((pb-pa)*10)/10,dsis=Math.round(b.s)-Math.round(a.s);
  return '<div class="card"><h3>Tu presión y tu peso</h3><p class="muted" style="margin:0 0 6px">Semana del '+shortDate(a.k)+" → semana del "+shortDate(b.k)+' (peso de La salud de mi día)</p>'+
    '<div class="sum"><b>Peso</b><span class="delta '+(dp<0?"up":dp>0?"down":"eq")+'">'+String(pa).replace(".",",")+" → "+String(pb).replace(".",",")+" kg</span></div>"+
    '<div class="sum"><b>Máxima</b><span class="delta '+(dsis<0?"up":dsis>0?"down":"eq")+'">'+Math.round(a.s)+" → "+Math.round(b.s)+"</span></div>"+
    '<p class="muted" style="margin:8px 0 0">Como vimos en el libro, por cada kilo de grasa que se pierde, la presión baja, en promedio, alrededor de 1 mmHg.</p></div>';
}

  document.getElementById("pOk").onclick=function(){var v=document.getElementById("pName").value.trim();if(!v){toast("Escribí tu nombre para que sepa quién lo envía");return;}S.name=v;save();closeSheet();cb(v);};
}
function sendDoc(){
  patientName(function(nm){
    var dt=new Date(),L=["*Presión arterial · Mejor Sin Pastillas*","Paciente: "+nm,"Enviado el "+dt.getDate()+"/"+(dt.getMonth()+1)+"/"+dt.getFullYear()];
    if(S.goal.s||S.goal.d)L.push("Objetivo: menos de "+(S.goal.s||"—")+"/"+(S.goal.d||"—"));
    L.push("","*Promedio por semana* (máx./mín.)");
    weekly().slice(-6).forEach(function(w){L.push("Semana del "+shortDate(w.k)+": "+Math.round(w.s)+"/"+Math.round(w.d)+" ("+w.n+" med.)");});
    L.push("","*Mediciones de las últimas dos semanas*");
    sorted().filter(function(r){return r.date>addDays(today(),-14);}).forEach(function(r){
      var t=fullDate(r.date)+" "+r.time+": "+r.s1+"/"+r.d1+(r.p1!=null?" p"+r.p1:"");
      if(r.s2!=null)t+=" · "+r.s2+"/"+r.d2+(r.p2!=null?" p"+r.p2:"");
      if(r.com)t+=" ("+r.com+")";L.push(t);});
    location.href="https://wa.me/"+WA+"?text="+encodeURIComponent(L.join("\n"));
  });
}
