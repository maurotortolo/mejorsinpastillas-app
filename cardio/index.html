<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#25348F">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../icons/icon-192.png">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cardio">
<title>Cardio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Carlito:wght@400;700&display=swap" rel="stylesheet">
<style>
/* Layout: app de una pantalla, encabezado azul marino, sesiones en tarjetas, tabla mensual como la del cuaderno, barra de pestañas abajo. */
:root{
  --navy:#25348F; --green:#2F6B5B; --mint:#D6EFE6; --sand:#EFE9DC;
  --bg:#F5F6FA; --card:#FFFFFF; --ink:#1C2033; --muted:#5D6478; --line:#DDE1EC;
  --good:#2F6B5B; --warn:#9A6A12;
  --font:"Carlito", Calibri, "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --navy:#8E9CF0; --green:#7CC9AE; --mint:#1F3A33; --sand:#2B2820;
    --bg:#11131C; --card:#1A1D2A; --ink:#E9EBF3; --muted:#A3A9BD; --line:#2C3042;
    --good:#7CC9AE; --warn:#E3B45A; color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --navy:#8E9CF0; --green:#7CC9AE; --mint:#1F3A33; --sand:#2B2820;
  --bg:#11131C; --card:#1A1D2A; --ink:#E9EBF3; --muted:#A3A9BD; --line:#2C3042;
  --good:#7CC9AE; --warn:#E3B45A; color-scheme: dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.4;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--green);outline-offset:2px}
.app{display:flex;flex-direction:column;height:100%;max-width:560px;margin:0 auto}
header{background:#25348F;color:#fff;padding:calc(14px + env(safe-area-inset-top)) 18px 14px}
header .brand{font-size:12px;letter-spacing:.14em;text-transform:uppercase;opacity:.8}
header h1{margin:2px 0 0;font-size:26px;text-wrap:balance}
header p{margin:4px 0 0;font-size:14px;opacity:.85}
main{flex:1;overflow-y:auto;padding:16px 16px 24px;display:flex;flex-direction:column;gap:16px}
nav{display:grid;grid-template-columns:repeat(4,1fr);background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{background:none;border:0;padding:10px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px;color:var(--muted)}
nav button svg{width:24px;height:24px}
nav button[aria-current="page"]{color:var(--navy);font-weight:700}
.banner{background:var(--sand);border-radius:12px;padding:12px 14px;font-size:15px;display:flex;flex-direction:column;gap:8px}
.banner b{color:var(--ink)}
.group h2{font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--green);margin:0 0 8px}
.list{display:flex;flex-direction:column;gap:8px}
.ex{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;text-align:left;width:100%}
.ex .txt{flex:1;min-width:0}
.ex .name{font-weight:700;font-size:18px}
.ex .meta{color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.ex .plus{flex:none;width:40px;height:40px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-size:26px;line-height:1}
:root[data-theme="dark"] .ex .plus{color:#11131C}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .ex .plus{color:#11131C}}
.chip{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--mint);color:var(--good);margin-left:6px;vertical-align:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.card h3{margin:0 0 8px;font-size:18px}
.muted{color:var(--muted);font-size:14px}
select,input[type=text],input[type=number],input[type=date],textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
label{font-size:14px;color:var(--muted);display:block;margin-bottom:4px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:16px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}
th{font-size:13px;color:var(--muted);font-weight:700}
td.del{text-align:right}
.icon-btn{background:none;border:0;color:var(--muted);padding:4px 6px;font-size:14px;text-decoration:underline}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:700;background:var(--navy);color:#fff}
:root[data-theme="dark"] .btn{color:#11131C}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn{color:#11131C}}
.btn.sec{background:var(--mint);color:var(--good)}
.btn.ghost{background:none;color:var(--navy);border:1px solid var(--line)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row > *{flex:1}
.bar{height:10px;border-radius:6px;background:var(--line);overflow:hidden}
.bar > i{display:block;height:100%;background:var(--green);border-radius:6px}
.chart svg{width:100%;height:auto;display:block}
/* hoja inferior */
.sheet-bg{position:fixed;inset:0;background:rgba(10,12,25,.45);display:none;align-items:flex-end;justify-content:center;z-index:10}
.sheet-bg.open{display:flex}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px;max-height:92%;overflow-y:auto}
.sheet h3{margin:0;font-size:22px}
.stepper{display:grid;grid-template-columns:52px 1fr 52px;gap:8px;align-items:center}
.stepper button{height:52px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-size:24px;font-weight:700}
.stepper input{text-align:center;font-size:28px;font-weight:700;height:52px;font-variant-numeric:tabular-nums}
.quick{display:flex;gap:6px;flex-wrap:wrap}
.quick button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 12px;font-size:14px}
.hint{background:var(--mint);color:var(--ink);border-radius:10px;padding:10px 12px;font-size:14px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:15px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20}
.toast.show{opacity:1}
@media (prefers-reduced-motion: reduce){.toast{transition:none}}
footer{text-align:center;color:var(--muted);font-size:12px;padding:4px 0 8px}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stats div{background:var(--bg);border-radius:10px;padding:10px 12px}
.stats b{display:block;font-size:24px;color:var(--green);font-variant-numeric:tabular-nums}
.stats span{font-size:14px;color:var(--muted)}
.ses{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.ses .txt{flex:1;min-width:0}.ses .name{font-weight:700;font-size:17px}.ses .meta{color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.tscroll{overflow-x:auto}
table.mes th[scope=row],table.mes thead th:first-child{position:sticky;left:0;background:var(--card);box-shadow:1px 0 0 var(--line);z-index:1}
table.mes{min-width:100%;font-size:15px}
table.mes th[scope=row]{font-weight:700;color:var(--ink);font-size:13px;min-width:118px;max-width:130px;white-space:normal;position:sticky;left:0;background:var(--card)}
table.mes td,table.mes thead th{white-space:nowrap;text-align:center;min-width:84px}
table.mes td:last-child,table.mes thead th:last-child{background:var(--mint)}
input.inl{width:72px;display:inline-block;padding:6px 8px;text-align:center}
.lbl{font-size:14px;color:var(--muted);margin-bottom:6px;padding:0}
.quick button[aria-pressed=true]{background:var(--navy);color:#fff;border-color:var(--navy)}
:root[data-theme="dark"] .quick button[aria-pressed=true]{color:#11131C}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .quick button[aria-pressed=true]{color:#11131C}}
.sr{position:absolute;left:-9999px}
td.obs{white-space:normal;min-width:110px;font-size:13px;color:var(--muted);text-align:left}
.mgrp h4{margin:6px 0 8px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--green)}
.mgrp{border-top:1px solid var(--line);padding-top:6px}
.mrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.mrow input{width:84px;flex:none;text-align:center;font-size:18px;font-weight:700}
.mrow span{color:var(--muted);font-size:15px}
.pace{margin-top:6px;color:var(--green);font-weight:700}
.sum{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.delta{flex:none;font-weight:700;font-size:15px;text-align:right;font-variant-numeric:tabular-nums}
.delta.up{color:var(--good)}.delta.down{color:var(--warn)}.delta.eq{color:var(--muted)}
</style>
</head>
<body>
<div class="app">
  <header>
    <a class="brand" href="../entrenamiento/" style="color:#fff;text-decoration:none">‹ Registro de mi entrenamiento</a>
    <h1 id="title">Cardio</h1>
    <p id="subtitle">Tus promedios de cada mes, como en el cuaderno.</p>
  </header>
  <main id="main"></main>
  <nav aria-label="Secciones">
    <button data-view="mes" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 5v15M15 5v15"/></svg>Mes a mes</button>
    <button data-view="evo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19h16M5 15l4-4 4 3 6-7"/></svg>Evolución</button>
    <button data-view="metas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r="0.8" fill="currentColor"/></svg>Metas</button>
    <button data-view="mas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>Más</button>
  </nav>
</div>

<div class="sheet-bg" id="sheetBg" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="sheet" id="sheet"></div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
"use strict";
var KEY="msp_cardio_v1";
var WA="5493462306304";
/* pace: unidad de ritmo de cada disciplina. dist: unidad en que se anota la distancia. */
var DISC=[
  {id:"cam",name:"Caminata",pace:"minkm",dist:"km"},
  {id:"run",name:"Running",pace:"minkm",dist:"km"},
  {id:"bici",name:"Ciclismo",pace:"kmh",dist:"km"},
  {id:"nat",name:"Natación",pace:"min100",dist:"m"},
  {id:"remo",name:"Remo",pace:"min500",dist:"m"},
  {id:"otra",name:"Otra",pace:"minkm",dist:"km"}
];
function D(id){for(var i=0;i<DISC.length;i++)if(DISC[i].id===id)return DISC[i];return DISC[DISC.length-1];}
var MESES=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
var MESES_L=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
function pad(n){return String(n).padStart(2,"0");}
function ymd(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
function mk(d){return d.getFullYear()+"-"+pad(d.getMonth()+1);}
function today(){return ymd(new Date());}
function monthKey(s){return s.slice(0,7);}
function monthLabel(k){var p=k.split("-");return MESES[+p[1]-1]+" "+p[0].slice(2);}
function monthFull(k){var p=k.split("-");return MESES_L[+p[1]-1]+" "+p[0];}
function suggestedMonth(){var d=new Date();d.setDate(1);if(new Date().getDate()<=10)d.setMonth(d.getMonth()-1);return mk(d);}
function monthsBack(n){var r=[],d=new Date();d.setDate(1);for(var i=0;i<n;i++){r.push(mk(d));d.setMonth(d.getMonth()-1);}return r;}
function num(x,dec){var f=Math.pow(10,dec==null?1:dec);return (Math.round(x*f)/f).toString().replace(".",",");}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function parseNum(v){var x=parseFloat(String(v).replace(",","."));return isNaN(x)?null:x;}

/* months["2026-11"]["run"] = {veces, km, min, bkm, bmin}: promedios del mes y mejor sesión. */
function blank(){return {v:1,prof:"",months:{},notes:{},sessions:[],nextId:1,goal:{fecha:"",plazo:"",disc:"run",km:"",min:""},sport:{que:"",plazo:""},last:{disc:"cam"}};}
function fromSessions(d){
  var g={};
  (d.sessions||[]).forEach(function(s){var k=monthKey(s.date);(g[k]=g[k]||{});(g[k][s.disc]=g[k][s.disc]||[]).push(s);});
  Object.keys(g).forEach(function(k){Object.keys(g[k]).forEach(function(di){
    var ss=g[k][di],p=k.split("-"),days=new Date(+p[0],+p[1],0).getDate();
    if(k===monthKey(today()))days=new Date().getDate();
    var withKm=ss.filter(function(s){return s.km;}),min=0,km=0,best=null;
    withKm.forEach(function(s){km+=s.km;if(!best||s.min/s.km<best.min/best.km)best=s;});
    ss.forEach(function(s){min+=s.min;});
    d.months[k]=d.months[k]||{};
    d.months[k][di]={veces:Math.round(ss.length/(Math.max(days,7)/7)*10)/10,km:withKm.length?Math.round(km/withKm.length*100)/100:null,min:Math.round(min/ss.length),bkm:best?best.km:null,bmin:best?best.min:null};
  });});
}
function migrate(d){if(!d||typeof d!=="object")return blank();if(!d.v)d.v=1;/* futuras versiones: convertir aquí, nunca borrar campos */
  if(!d.sessions)d.sessions=[];if(!d.notes)d.notes={};if(!d.goal)d.goal=blank().goal;if(!d.sport)d.sport=blank().sport;if(!d.last)d.last=blank().last;
  if(!d.months){d.months={};fromSessions(d);}
  if(!d.nextId)d.nextId=d.sessions.reduce(function(m,s){return Math.max(m,s.id+1);},1);return d;}
var S;
try{var raw=localStorage.getItem(KEY);S=raw?migrate(JSON.parse(raw)):blank();}catch(e){S=blank();}
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
var storageOK=true;
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));storageOK=true;}catch(e){storageOK=false;}}

/* Ritmo: minutos por km (o por 100 m / 500 m) o km/h. */
function paceVal(disc,min,km){if(!km||!min)return null;var p=D(disc).pace;
  if(p==="kmh")return km/(min/60);if(p==="min100")return min/(km*10);if(p==="min500")return min/(km*2);return min/km;}
function paceTxt(disc,v,short){if(v==null)return "—";var p=D(disc).pace;
  if(p==="kmh")return num(v)+" km/h";
  var m=Math.floor(v),s=Math.round((v-m)*60);if(s===60){m++;s=0;}
  return m+":"+pad(s)+(short?"":(p==="min100"?" min/100 m":p==="min500"?" min/500 m":" min/km"));}
function paceUnit(disc){var p=D(disc).pace;return p==="kmh"?"km/h":p==="min100"?"min/100 m":p==="min500"?"min/500 m":"min/km";}
function distTxt(disc,km){if(km==null||km==="")return "—";return D(disc).dist==="m"?Math.round(km*1000)+" m":num(km,2)+" km";}
function entry(k,disc){return S.months[k]&&S.months[k][disc]||null;}
function usedDiscs(){var u={};Object.keys(S.months).forEach(function(k){Object.keys(S.months[k]).forEach(function(d){u[d]=1;});});return DISC.filter(function(d){return u[d.id];});}
function monthsOf(disc){return Object.keys(S.months).filter(function(k){return entry(k,disc);}).sort();}
function hasAny(){return Object.keys(S.months).some(function(k){return Object.keys(S.months[k]).length;});}

var toastT;
function toast(msg){var t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove("show");},2200);}

var view="mes", disc=null, metric="veces";
var main=document.getElementById("main");
function curDiscSel(){var u=usedDiscs();if(disc&&u.some(function(d){return d.id===disc;}))return disc;if(u.some(function(d){return d.id===S.last.disc;}))return S.last.disc;return u.length?u[0].id:S.last.disc;}
function discSelect(id){var u=usedDiscs(),c=curDiscSel();if(u.length<2)return "";return '<div><label for="'+id+'">Disciplina</label><select id="'+id+'">'+u.map(function(d){return '<option value="'+d.id+'"'+(d.id===c?" selected":"")+">"+d.name+"</option>";}).join("")+"</select></div>";}

function isIOS(){return /iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);}
function standalone(){return (window.matchMedia&&matchMedia("(display-mode: standalone)").matches)||navigator.standalone===true;}
function topNotices(){
  var h="";
  if(isIOS()&&!standalone()&&!S.hideIOS){h+='<div class="banner"><div><b>Instalala en tu iPhone.</b> Tocá el botón Compartir de Safari y elegí <b>Agregar a pantalla de inicio</b>. Así tus registros quedan guardados. Si no la instalás, el iPhone puede borrarlos cuando pasan unos días sin usarla.</div><div><button class="btn ghost" id="hideIOS">Entendido</button></div></div>';}
  if(Object.keys(S.months).length>=3){var lb=S.lastBackup?new Date(S.lastBackup):null;var days=lb?(Date.now()-lb.getTime())/864e5:999;if(days>30)h+='<div class="banner"><div><b>Hacé una copia de seguridad.</b> '+(lb?"Pasó más de un mes desde la última.":"Todavía no hiciste ninguna.")+' Si cambiás de teléfono, te va a permitir recuperar tus registros.</div><div><button class="btn" id="goBackup">Hacer copia ahora</button></div></div>';}
  return h;
}

var ROWS=[
  ["Veces por semana (promedio)",function(e){return num(e.veces);}],
  ["Minutos por sesión (promedio)",function(e){return e.min?Math.round(e.min)+"":"—";}],
  ["Distancia por sesión (promedio)",function(e,d){return distTxt(d,e.km);}],
  ["Kilómetros por semana",function(e){return e.km?num(e.km*e.veces):"—";}],
  ["Ritmo promedio",function(e,d){return paceTxt(d,paceVal(d,e.min,e.km));}],
  ["Mejor sesión del mes",function(e,d){return e.bkm&&e.bmin?distTxt(d,e.bkm)+" en "+e.bmin+" min":"—";}],
  ["Mejor ritmo del mes",function(e,d){return paceTxt(d,paceVal(d,e.bmin,e.bkm));}]
];

function renderMes(){
  var h=topNotices();
  var sm=suggestedMonth(),done=S.months[sm]&&Object.keys(S.months[sm]).length;
  h+='<button class="btn" id="fillMonth" style="padding:16px;font-size:19px">'+(done?"Revisar ":"Completar ")+monthFull(sm)+'</button>';
  if(!hasAny()){
    h+='<div class="card"><h3>¿Cómo se usa?</h3><p class="muted" style="margin:0">Al final de cada mes, tocá el botón de arriba y anotá tus promedios: cuántas veces por semana hiciste cardio y, en promedio, qué distancia recorriste y cuánto tiempo te llevó cada sesión. También tu mejor sesión del mes. La app arma tu tabla, igual a la del cuaderno, y tus gráficos.</p></div>';
  } else {
    var d=curDiscSel(),ms=monthsOf(d).slice(-6);
    h+=discSelect("mesDisc");
    h+='<div class="card" style="padding:0"><div class="tscroll"><table class="mes"><thead><tr><th scope="col"><span class="sr">Indicador</span></th>'+ms.map(function(k){return '<th scope="col"><button class="icon-btn" data-month="'+k+'" aria-label="Editar '+monthFull(k)+'">'+monthLabel(k)+"</button></th>";}).join("")+"</tr></thead><tbody>";
    ROWS.forEach(function(r){h+='<tr><th scope="row">'+r[0]+"</th>"+ms.map(function(k){return "<td>"+esc(r[1](entry(k,d),d))+"</td>";}).join("")+"</tr>";});
    h+='<tr><th scope="row">Observaciones</th>'+ms.map(function(k){return '<td class="obs">'+esc(S.notes[k]||"—")+"</td>";}).join("")+"</tr>";
    h+='</tbody></table></div></div><p class="muted" style="margin:0">'+D(d).name+'. Tocá un mes para corregirlo; deslizá la tabla para ver meses anteriores.</p>';
    h+='<div class="card"><h3>Compartir con tu médico</h3><p class="muted" style="margin:0 0 10px">Se abre WhatsApp con tu tabla de los últimos meses, lista para enviar al Dr. Mauro Tortolo. Vos decidís si la mandás.</p><button class="btn sec" id="sendDoc">Enviar mi evolución por WhatsApp</button></div>';
  }
  h+='<footer>Dr. Mauro Tortolo · @mejorsinpastillas</footer>';

var METRICS={
  veces:{name:"Veces por semana",val:function(e){return e.veces;},fmt:function(v){return num(v);},hi:true},
  km:{name:"Distancia por sesión",val:function(e,d){return e.km?(D(d).dist==="m"?e.km*1000:e.km):null;},fmt:function(v,d){return D(d).dist==="m"?Math.round(v)+" m":num(v)+" km";},hi:true},
  kmsem:{name:"Kilómetros por semana",val:function(e){return e.km?e.km*e.veces:null;},fmt:function(v){return num(v)+" km";},hi:true},
  min:{name:"Minutos por sesión",val:function(e){return e.min||null;},fmt:function(v){return Math.round(v)+" min";},hi:true},
  ritmo:{name:"Ritmo promedio",val:function(e,d){return paceVal(d,e.min,e.km);},fmt:function(v,d){return paceTxt(d,v);},pace:true}
};
function chart(d,mkey){
  var M=METRICS[mkey],pts=monthsOf(d).slice(-12).map(function(k){var v=M.val(entry(k,d),d);return v==null?null:{k:k,v:v};}).filter(Boolean);
  if(pts.length<2)return '<p class="muted">El gráfico aparece cuando tengas este dato en al menos dos meses.</p>';
  var faster=M.pace&&D(d).pace!=="kmh"; /* en min/km, menos es mejor: se dibuja invertido para que subir sea mejorar */
  var W=320,H=180,pl=10,pr=10,pt=26,pb=28;
  var vals=pts.map(function(p){return p.v;}),mn=Math.min.apply(null,vals),mx=Math.max.apply(null,vals);
  if(mx===mn){mx+=1;mn=Math.max(0,mn-1);}var padv=(mx-mn)*0.2;mn-=padv;mx+=padv;
  function x(i){return pl+18+(W-pl-pr-36)*(i/(pts.length-1));}
  function y(v){var t=(v-mn)/(mx-mn);if(faster)t=1-t;return pt+(H-pt-pb)*(1-t);}
  var line=pts.map(function(p,i){return x(i)+","+y(p.v);}).join(" ");
  var area="M"+x(0)+","+(H-pb)+" L"+line.split(" ").join(" L")+" L"+x(pts.length-1)+","+(H-pb)+" Z";
  var g='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+(H-pb)+'" y2="'+(H-pb)+'" stroke="var(--line)"/>';
  pts.forEach(function(p,i){var last=i===pts.length-1;
    g+='<circle cx="'+x(i)+'" cy="'+y(p.v)+'" r="'+(last?5:3.5)+'" fill="'+(last?"var(--green)":"var(--card)")+'" stroke="var(--green)" stroke-width="2"/>';
    g+='<text x="'+x(i)+'" y="'+(y(p.v)-10)+'" text-anchor="middle" font-size="'+(last?12:10)+'"'+(last?' font-weight="700" fill="var(--green)"':' fill="var(--muted)"')+">"+esc(M.fmt(p.v,d).replace(/ (min\/km|min\/100 m|min\/500 m)$/,""))+"</text>";
    g+='<text x="'+x(i)+'" y="'+(H-10)+'" text-anchor="middle" font-size="11" fill="var(--muted)">'+monthLabel(p.k)+"</text>";});
  return '<div class="chart"><svg viewBox="0 0 '+W+" "+H+'" role="img" aria-label="'+esc(M.name)+' de cada mes"><path d="'+area+'" fill="var(--mint)" opacity=".7"/><polyline points="'+line+'" fill="none" stroke="var(--green)" stroke-width="2.5" stroke-linejoin="round"/>'+g+"</svg></div>"+
    (faster?'<p class="muted" style="margin:6px 0 0">Ritmo en '+paceUnit(d)+': cuanto menos minutos, más rápido. Por eso el gráfico sube cuando mejorás.</p>':"");
}
function renderEvo(){
  if(!hasAny()){main.innerHTML='<div class="card"><p class="muted" style="margin:0">Cuando completes tu primer mes, vas a ver acá tus gráficos.</p></div>';return;}
  var d=curDiscSel(),ms=monthsOf(d);

  if(ms.length>=2){var a=entry(ms[0],d),b=entry(ms[ms.length-1],d),items=[];
    items.push(["Veces por semana",num(a.veces),num(b.veces),b.veces-a.veces>0?"up":b.veces<a.veces?"down":"eq"]);
    if(a.km&&b.km)items.push(["Distancia por sesión",distTxt(d,a.km),distTxt(d,b.km),b.km>a.km?"up":b.km<a.km?"down":"eq"]);
    var pa=paceVal(d,a.min,a.km),pb=paceVal(d,b.min,b.km);

function openMonth(k,d){
  d=d||(S.months[k]&&Object.keys(S.months[k])[0])||curDiscSel();
  var e=entry(k,d)||{};
  var opts=monthsBack(12);Object.keys(S.months).forEach(function(m){if(opts.indexOf(m)<0)opts.push(m);});opts.sort().reverse();

  h+='<div><label for="mSel">Mes</label><select id="mSel">'+opts.map(function(m){return '<option value="'+m+'"'+(m===k?" selected":"")+">"+monthFull(m)+"</option>";}).join("")+"</select></div>";
  h+='<fieldset style="border:0;padding:0;margin:0"><legend class="lbl">Disciplina</legend><div class="quick" id="discs">'+DISC.map(function(x){var has=entry(k,x.id);return '<button type="button" data-d="'+x.id+'" aria-pressed="'+(x.id===d)+'">'+x.name+(has?" ✓":"")+"</button>";}).join("")+'</div></fieldset>';
  h+='<div class="mgrp"><h4>Promedios del mes</h4>';
  h+='<div><label for="mVeces">Veces por semana</label><div class="stepper"><button type="button" data-step="-0.5" aria-label="Restar media vez">−</button><input id="mVeces" type="number" inputmode="decimal" step="0.5" min="0" value="'+(e.veces!=null?e.veces:"")+'"><button type="button" data-step="0.5" aria-label="Sumar media vez">+</button></div></div>';
  h+='<p class="muted" style="margin:10px 0 6px">En promedio, en cada sesión:</p><div class="mrow"><input id="mKm" type="number" inputmode="decimal" step="0.1" min="0" value="'+distIn(d,e.km)+'" aria-label="Distancia promedio en '+u+'"><span class="uL">'+u+" en</span><input id=\"mMin\" type=\"number\" inputmode=\"numeric\" min=\"1\" value=\""+(e.min||"")+'" aria-label="Minutos promedio"><span>minutos</span></div>';
  h+='<div class="muted pace" id="pAvg"></div></div>';
  h+='<div class="mgrp"><h4>Tu mejor sesión del mes</h4><div class="mrow"><input id="bKm" type="number" inputmode="decimal" step="0.1" min="0" value="'+distIn(d,e.bkm)+'" aria-label="Distancia de tu mejor sesión en '+u+'"><span class="uL">'+u+" en</span><input id=\"bMin\" type=\"number\" inputmode=\"numeric\" min=\"1\" value=\""+(e.bmin||"")+'" aria-label="Minutos de tu mejor sesión"><span>minutos</span></div><div class="muted pace" id="pBest"></div></div>';
  h+='<div><label for="mObs">Observaciones del mes (opcional)</label><input id="mObs" type="text" value="'+esc(S.notes[k]||"")+'" placeholder="Por ejemplo: empecé con pasadas, me lesioné, vacaciones"></div>';
  h+='<div class="row"><button class="btn ghost" id="mCancel">Cancelar</button><button class="btn" id="mSave">Guardar</button></div>';

    document.getElementById("pAvg").textContent=a?"Ritmo promedio: "+paceTxt(d,a):"";document.getElementById("pBest").textContent=b?"Ritmo: "+paceTxt(d,b):"";}
